    const semLocal = !!p.semLocal;
    document.getElementById('btnPlaceDirections').style.display = semLocal ? 'none' : '';
    document.getElementById('placeAviso').style.display = semLocal ? 'block' : 'none';
    pintaFav(p);
    placeCard.style.display = 'block';
    searchResults.innerHTML = '';
    mainSug.classList.remove('open');
  }
  document.getElementById('btnPlaceDirections').addEventListener('click', ()=>{
    if(!selectedPlace || selectedPlace.semLocal) return;
    // o lugar escolhido e o DESTINO (como no Google Maps); a partida fica pra preencher
    const ultimo = stops.length-1;
    if(!stops[ultimo]) stops[ultimo] = selectedPlace;
    else {
      const vago = stops.findIndex(s=>!s);
      stops[vago === -1 ? ultimo : vago] = selectedPlace;
    }
    showTab('route');
    renderStops(); renderStopMarkers(); updateTraceBtn();
    const vazio = [...stopsList.querySelectorAll('input')].find(i=>!i.value);
    if(vazio) vazio.focus();
  });

  // ============ favoritos ============
  // Guardados no proprio aparelho: quem trabalha no balcao repete os mesmos lugares
  // o dia inteiro, e o visitante marca pra onde vai voltar.
  const FAV_KEY = 'af2026_favoritos';
  function idDe(p){ return p.kind+'|'+(p.num||'')+'|'+p.nome; }
  function lerFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
  function gravarFavs(v){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(v)); }catch(e){} }
  function ehFav(p){ return lerFavs().indexOf(idDe(p)) >= 0; }
  function alternarFav(p){
    const favs = lerFavs(), id = idDe(p), i = favs.indexOf(id);
    if(i>=0) favs.splice(i,1); else favs.push(id);
    gravarFavs(favs);
    return i < 0;
  }
  const btnPlaceFav = document.getElementById('btnPlaceFav');
  function pintaFav(p){
    const on = ehFav(p);
    btnPlaceFav.textContent = on ? '★' : '☆';
    btnPlaceFav.classList.toggle('on', on);
    btnPlaceFav.title = on ? 'Remover dos favoritos' : 'Favoritar';
  }
  btnPlaceFav.addEventListener('click', ()=>{
    if(!selectedPlace) return;
    const virouFav = alternarFav(selectedPlace);
    pintaFav(selectedPlace);
    toast(virouFav ? 'Salvo nos favoritos.' : 'Removido dos favoritos.');
  });
  // Uma linha de resultado, com estrela. Assim dá pra favoritar direto da busca, sem
  // precisar abrir o lugar (e sem depender de desligar a partida fixa pra ver o cartão).
  function linhaResultado(p, naListaDeFavoritos){
    const row = document.createElement('div'); row.className = 'result-row';
    const txt = document.createElement('span');
    txt.innerHTML = `${p.num?`<b>${p.num}</b> — `:''}${p.tipo?p.tipo+' ':''}${p.nome}`;
    if(p.resp){
      const r = document.createElement('span');
      r.className = 'row-resp';
      r.textContent = p.resp;
      txt.appendChild(r);
    }
    const dir = document.createElement('span'); dir.className = 'row-dir';
    if(!naListaDeFavoritos){
      const tag = document.createElement('span'); tag.className = 'row-tag';
      tag.textContent = p.catGroup || (p.kind==='lote' ? 'lote' : '');
      dir.appendChild(tag);
    }
    const estrela = document.createElement('button');
    function pinta(on){
      estrela.textContent = on ? '★' : '☆';
      estrela.classList.toggle('on', on);
      estrela.title = on ? 'Remover dos favoritos' : 'Favoritar';
    }
    estrela.className = 'row-fav';
    pinta(ehFav(p));
    estrela.addEventListener('click', (ev)=>{
      ev.stopPropagation();                 // a estrela não abre o lugar
      const virouFav = alternarFav(p);
      pinta(virouFav);
      if(naListaDeFavoritos && !virouFav) renderFavoritos();
    });
    dir.appendChild(estrela);
    row.appendChild(txt); row.appendChild(dir);
    row.addEventListener('click', ()=> onMapPick(p));
    return row;
  }

  function renderFavoritos(){
    const achados = lerFavs().map(id => points.find(p => idDe(p)===id)).filter(Boolean);
    searchResults.innerHTML = '<div class="fav-head">Favoritos</div>';
    if(!achados.length){
      searchResults.innerHTML += '<div class="fav-vazio">Toque na estrela ao lado de qualquer ' +
        'resultado da busca para ele ficar salvo aqui.</div>';
      return;
    }
    achados.forEach(p=> searchResults.appendChild(linhaResultado(p, true)));
  }

  // ============ programacao ============
  // Gerada da planilha oficial (gerar_programacao.py). "Que horas toca fulano" e "o que
  // tem hoje" sao as perguntas que mais chegam no balcao depois de "onde fica".
  const progOverlay = document.getElementById('progOverlay');
  const PROG = (window.AF_PROG && window.AF_PROG.dias) || [];
  let progDiaSel = 0;
  function hojeDDMM(){
    const d = new Date();
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  }
  function minutosDe(hora){
    const m = /^(\d{1,2})h(\d{2})?/.exec(hora||'');
    return m ? parseInt(m[1],10)*60 + parseInt(m[2]||'0',10) : null;
  }
  function pontoDoPalco(palco){
    return points.find(p => p.kind==='poi' && p.nome === 'Palco ' + palco);
  }
  function renderProgDias(){
    const tira = document.getElementById('progDias');
    tira.innerHTML = '';
    PROG.forEach((d,i)=>{
      const b = document.createElement('button');
      b.className = 'prog-dia' + (i===progDiaSel ? ' on' : '');
      b.innerHTML = `<b>${d.data}</b>${d.semana}`;
      b.addEventListener('click', ()=>{ progDiaSel = i; renderProgDias(); renderProgLista(); });
      tira.appendChild(b);
    });
    const ativo = tira.children[progDiaSel];
    if(ativo) ativo.scrollIntoView({block:'nearest', inline:'center'});
  }
  function renderProgLista(){
    const alvo = document.getElementById('progLista');
    const dia = PROG[progDiaSel];
    alvo.innerHTML = '';
    if(!dia) return;
    const ehHoje = dia.data === hojeDDMM();
    const agora = new Date().getHours()*60 + new Date().getMinutes();
    const palcos = [];
    dia.itens.forEach(it=>{ if(palcos.indexOf(it.palco)<0) palcos.push(it.palco); });
    palcos.forEach(palco=>{
      const cab = document.createElement('div'); cab.className='prog-palco';
      cab.innerHTML = `<span>Palco ${palco}</span>`;
      const ponto = pontoDoPalco(palco);
      if(ponto){
        const ir = document.createElement('button');
        ir.className='prog-ir'; ir.textContent='ver no mapa';
        ir.addEventListener('click', ()=>{ progOverlay.style.display='none'; onMapPick(ponto); });
        cab.appendChild(ir);
      }
      alvo.appendChild(cab);
      const doPalco = dia.itens.filter(i=>i.palco===palco);
      // no dia de hoje, destaca o proximo que ainda vai comecar
      let proximo = -1;
      if(ehHoje){
        proximo = doPalco.findIndex(i=>{ const m = minutosDe(i.hora); return m!=null && m >= agora; });
      }
      doPalco.forEach((it,i)=>{
        const li = document.createElement('div');
        li.className = 'prog-item' + (i===proximo ? ' agora' : '');
        li.innerHTML = `<span class="h">${it.hora || '—'}</span><span>${it.atracao}</span>`;
        alvo.appendChild(li);
      });
    });
  }
  function abrirProg(){
    const i = PROG.findIndex(d=>d.data === hojeDDMM());
    progDiaSel = i >= 0 ? i : progDiaSel;
    renderProgDias(); renderProgLista();
    fecharOverlays();
    progOverlay.style.display = 'block';
  }
  document.getElementById('btnProg').addEventListener('click', abrirProg);
  document.getElementById('btnProgClose').addEventListener('click', ()=> progOverlay.style.display='none');

  // ============ atalhos "mais perto daqui" ============
  // As perguntas que mais chegam no balcão depois de "onde fica o piquete X". A resposta
  // não é óbvia: são 4 sanitários num parque grande, e os seis serviços (ambulatório,
  // brigada, bombeiros, polícias, juizado) estão todos juntos na Casa do Gaúcho.
  const ATALHOS = [
    { icone:'🚻',  rotulo:'Banheiro',       acha: p => p.tipo === 'Sanitários' },
    { icone:'🍽️',  rotulo:'Comida',         acha: p => p.tipo === 'Praça de Alimentação' },
    { icone:'🚑',  rotulo:'Ambulatório',    acha: p => /ambulat/i.test(p.nome) },
    { icone:'🚓',  rotulo:'Brigada',        acha: p => /brigada|pol[íi]cia|bombeiro/i.test(p.nome) },
    { icone:'🅿️',  rotulo:'Estacionamento', acha: p => p.cat === 'park' },
    { icone:'🚪',  rotulo:'Saída',          acha: p => /p[óo]rtico/i.test(p.nome) },
  ];
  // De onde é "aqui": a partida fixa, senão o GPS, senão o centro do que está na tela.
  function origemDoAtalho(){
    if(partidaFixaLigada()){ const o = pontoPartidaFixa(); if(o) return o; }
    if(gpsPoint) return gpsPoint;
    return { x: VB.x + VB.w/2, y: VB.y + VB.h/2, centroDaTela:true };
  }
  function maisPerto(filtro){
    const alvos = points.filter(p=> !p.semLocal && p._nodeId && filtro(p));
    if(!alvos.length) return null;
    const origem = origemDoAtalho();
    let deId = origem._nodeId;
    if(origem.centroDaTela){
      deId = 'AQUI_NODE';
      addNode(deId); graph[deId] = [];
      ligaNaRua(deId, origem.x, origem.y, 'VIA_AQUI', null);
    }
    const distMap = distanciasDe(deId);
    let melhor = null;
    alvos.forEach(p=>{
      const d = distMap[p._nodeId];
      if(d != null && d < Infinity && (!melhor || d < melhor.d)) melhor = { p, d };
    });
    return melhor;
  }
  const atalhosEl = document.getElementById('atalhos');
  ATALHOS.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'atalho';
    b.innerHTML = `<span>${a.icone}</span><span>${a.rotulo}</span>`;
    b.addEventListener('click', ()=>{
      if(b.classList.contains('ativo')){        // segundo toque desliga e apaga a rota
        limparRota();
        placeCard.style.display = 'none';
        showTab('search');
        return;
      }
      const achado = maisPerto(a.acha);
      if(!achado){ toast('Não encontrei ' + a.rotulo.toLowerCase() + ' no mapa.'); return; }
      toast(`${a.rotulo} mais perto: ${displayName(achado.p)} · ${Math.round(achado.d * M_POR_UNIDADE)} m`);
      onMapPick(achado.p);
      apagaAtalhoAtivo();
      b.classList.add('ativo');
    });
    atalhosEl.appendChild(b);
  });

  // ============ menu ============
  function fecharOverlays(){
    menuOverlay.style.display = 'none';
    configOverlay.style.display = 'none';
    progOverlay.style.display = 'none';
    qrOverlay.style.display = 'none';
  }
  // ============ funcionar sem sinal ============
  // O sinal no parque cai o tempo todo. O service worker guarda mapa e dados no
  // aparelho; so roda em https (ou localhost), entao no file:// simplesmente nao entra.
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  // primeira renderização
  if(cfgPartidaFixa.checked) aplicaPartidaFixa();
  renderStopMarkers();
})();
</script>
