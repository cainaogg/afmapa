<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapa do Acampamento Farroupilha 2026</title>
<meta name="description" content="Mapa interativo do Acampamento Farroupilha 2026 — busque piquetes por número ou nome e trace a rota mais rápida.">
<meta name="theme-color" content="#1a5c3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@400;600;700&family=Roboto+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#f2efe9; --panel:#ffffff; --ink:#1f2225; --ink-soft:#5f6368; --line:#dcdcdc;
  --road-fill:#ffffff; --road-fill-minor:#fbfaf8; --road-casing:#d4d0c4; --road-label:#7a7566;
  --lot-fill:#ffffff; --lot-border:#c9c5b8; --lot-text:#3c3a33;
  --accent:#1a5c3a; --accent-ink:#ffffff;
  --waypoint-a:#1a5c3a; --waypoint-b:#c0392b; --waypoint-mid:#e8710a;
  --shadow: 0 2px 10px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.1);
  --gps:#1a73e8;
  --cat-service:#e8748e; --cat-public:#5b8def; --cat-food:#c9863f; --cat-shop:#6b6b6b;
  --cat-market:#e0791f; --cat-agro:#c9a30d; --cat-media:#1e8e3e; --cat-stage:#c0286b;
  --cat-park:#7a9e6f; --cat-special:#d4a017; --cat-water:#7fb3e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1b1d1f; --panel:#26282b; --ink:#e8eaed; --ink-soft:#9aa0a6; --line:#3c3f42;
    --road-fill:#2c2e30; --road-fill-minor:#232527; --road-casing:#3a3c3e; --road-label:#9aa0a6;
    --lot-fill:#2c2e30; --lot-border:#48494b; --lot-text:#d8d6cd;
    --accent:#4caf7d; --accent-ink:#0b1220; --shadow: 0 2px 10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#1b1d1f; --panel:#26282b; --ink:#e8eaed; --ink-soft:#9aa0a6; --line:#3c3f42;
  --road-fill:#2c2e30; --road-fill-minor:#232527; --road-casing:#3a3c3e; --road-label:#9aa0a6;
  --lot-fill:#2c2e30; --lot-border:#48494b; --lot-text:#d8d6cd;
  --accent:#4caf7d; --accent-ink:#0b1220; --shadow: 0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Roboto',Arial,sans-serif;overscroll-behavior:none;}
.app{position:relative;height:100vh;height:100dvh;overflow:hidden;}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
/* a arte oficial do PDF e o que o visitante ve; a camada desenhada por nos fica de reserva */
svg#map .esquematico{display:none;}
svg#map.modo-esquematico .base-oficial{display:none;}
svg#map.modo-esquematico .esquematico{display:inline;}

.hud{position:absolute;z-index:5;}
.panel{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);}

.icon-btn{width:38px;height:38px;border:none;border-radius:50%;background:none;color:var(--ink-soft);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
.icon-btn:hover{background:var(--ground);}
.icon-btn.active{background:var(--accent);color:var(--accent-ink);}

/* barra de busca estilo Google Maps */
.gbar{display:flex;align-items:center;gap:2px;padding:8px;flex:none;}
.gbar-side{flex:none;}
.gbar-input{flex:1;margin:0;}
.gbar-input input{border:none;background:none;padding:9px 4px;font-size:15px;}
.gbar-input input:focus{outline:none;}

/* search / route sheet */
.sheet{top:10px;left:10px;width:320px;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);display:flex;flex-direction:column;overflow:hidden;}
.sheet.collapsed{display:none;}
@media (max-width: 720px){
  .sheet{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:66vh;}
}
.sheet-page{display:none;overflow:auto;flex:1;flex-direction:column;}
.sheet-page.active{display:flex;}

/* busca */
.search-wrap{padding:10px 12px;}
.search-row{position:relative;margin-bottom:8px;}

/* place card (estilo cartão de local do Google Maps) */
.place-card{padding:14px 16px 16px;border-top:1px solid var(--line);}
.place-card-cat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.place-card-title{font-family:'Roboto Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:12px;}
.place-card-actions{display:flex;gap:8px;}
.place-directions-btn{padding:9px 16px;border:none;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;cursor:pointer;}

/* legenda como painel flutuante (aberto pelo hamburguer) */
.legend-overlay{top:10px;left:10px;width:300px;max-height:calc(100vh - 20px);overflow:auto;z-index:6;}
.legend-overlay-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-family:'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:14px;color:var(--ink-soft);}
@media (max-width: 720px){ .legend-overlay{left:10px;right:10px;width:auto;} }
.search-row input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);font-family:'Roboto',sans-serif;font-size:14px;}
.search-row input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.suggestions{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:260px;overflow:auto;box-shadow:var(--shadow);display:none;}
.suggestions.open{display:block;}
.suggestions .item{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.suggestions .item:hover,.suggestions .item.active{background:var(--ground);}
.suggestions .item .n{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--accent);min-width:30px;}
.suggestions .item .nm{flex:1;}
.suggestions .item .tag{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.search-results{padding:0 12px 10px;}
.result-row{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
.result-row:hover{background:var(--ground);}
.result-row b{font-family:'Roboto Mono',monospace;color:var(--accent);}

/* rota / stops */
.stops-wrap{padding:12px;display:flex;flex-direction:column;gap:8px;flex:none;}
.stop-row{display:flex;align-items:center;gap:8px;}
.stop-dot{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
.stop-row input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);font-size:13.5px;}
.stop-remove{width:26px;height:26px;border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:16px;flex:none;}
.stop-grip{flex:none;width:20px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  cursor:grab;font-size:15px;line-height:1;touch-action:none;user-select:none;opacity:.55;}
.stop-grip:hover{opacity:1;}
.stop-row.arrastando{opacity:.45;}
.stop-row.alvo{box-shadow:0 -2px 0 var(--accent);}
.add-stop-btn{align-self:flex-start;background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;}
.trace-btn{padding:11px;border:none;border-radius:8px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;font-family:'Roboto',sans-serif;}
.trace-btn:disabled{opacity:.4;cursor:not-allowed;}
.gps-btn{padding:9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel);color:var(--gps);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;}
.route-info{font-size:12.5px;color:var(--ink-soft);line-height:1.6;padding:0 2px;display:none;}
.route-info.show{display:block;}
.route-info b{color:var(--ink);}
.route-steps{list-style:none;margin:6px 0 0;padding:0;font-size:12px;}
.route-steps li{padding:3px 0 3px 18px;position:relative;color:var(--ink-soft);}
.route-steps li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--accent);}

.config-list{padding:12px 14px 14px;}
.config-row{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13px;line-height:1.45;}
.config-row input{margin-top:2px;width:17px;height:17px;flex:none;accent-color:var(--accent);cursor:pointer;}
.config-row b{display:block;font-weight:600;}
.config-row em{display:block;font-style:normal;color:var(--ink-soft);font-size:11.5px;margin-top:2px;}

/* legenda */
.legend-list{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;overflow:auto;}
.legend-list .row{display:flex;align-items:flex-start;gap:9px;font-size:12px;}
.swatch{width:13px;height:13px;border-radius:3px;flex:none;margin-top:2px;}
.legend-list .txt{color:var(--ink-soft);line-height:1.4;}
.legend-list .txt b{color:var(--ink);}

/* zoom controls */
.fab-col{right:12px;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.zoom-ctrl{display:flex;flex-direction:column;box-shadow:var(--shadow);border-radius:10px;overflow:hidden;}
.zoom-ctrl button{width:44px;height:40px;border:none;background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer;border-bottom:1px solid var(--line);}
.zoom-ctrl button:last-child{border-bottom:none;}
.gps-fab{width:44px;height:44px;border-radius:50%;border:none;background:var(--panel);box-shadow:var(--shadow);color:var(--gps);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
@media (max-width: 720px){
  /* no celular a busca fica embaixo, entao a coluna de botoes vai pro topo direito */
  .fab-col{top:14px;bottom:auto;gap:9px;}
  .sheet{max-height:58vh;}
  /* zoom com dois dedos ja resolve no toque: os botoes +/- so ocupariam espaco */
  .zoom-ctrl{display:none;}
  /* o modo esquematico e ferramenta de conferencia, nao interessa ao visitante no celular */
  #btnBase{display:none;}
}

.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:20px;font-size:12.5px;box-shadow:var(--shadow);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;}
.toast.show{opacity:1;}

/* --- map drawing --- */
.road-casing{fill:none;stroke:var(--road-casing);stroke-linecap:round;stroke-linejoin:round;}
.road-fill{fill:none;stroke:var(--road-fill);stroke-linecap:round;stroke-linejoin:round;}
.road-fill.minor{stroke:var(--road-fill-minor);}
.road-label{font-family:'Roboto Condensed',sans-serif;font-size:22px;fill:var(--road-label);font-weight:600;}
.lot{fill:var(--lot-fill);stroke:var(--lot-border);stroke-width:2;}
.lot-num{font-family:'Roboto Mono',monospace;fill:var(--lot-text);text-anchor:middle;pointer-events:none;}
.lot.special{fill:#fff3cd;stroke:var(--cat-special);stroke-width:3;}
.lot-hit{fill:transparent;cursor:pointer;}
.stop-marker .pin{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
.stop-marker text{fill:#fff;font-weight:700;text-anchor:middle;font-family:'Roboto',sans-serif;pointer-events:none;}
.poi-dot{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
.poi-label{font-family:'Roboto',sans-serif;fill:var(--ink);text-anchor:middle;font-weight:500;pointer-events:none;}
.gate-label{font-family:'Roboto Condensed',sans-serif;font-weight:700;fill:var(--accent);}
.route-line{fill:none;stroke:var(--gps);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 22;opacity:0;transition:opacity .25s ease;}
.route-line.show{opacity:1;animation:dash 1s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-48;}}
@media (prefers-reduced-motion: reduce){.route-line.show{animation:none;}}
.gps-dot-outer{fill:rgba(26,115,232,.22);}
.gps-dot-inner{fill:var(--gps);stroke:#fff;stroke-width:3;}
</style>
</head>
<body>
<div class="app">
  <svg id="map" viewBox="100 800 6100 2350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>

  <div class="hud panel sheet" id="sheet">
    <div class="gbar">
      <button class="icon-btn gbar-side" id="btnBack" title="Menu">☰</button>
      <div class="search-row gbar-input">
        <input type="text" id="mainSearch" placeholder="Buscar piquete, palco, banheiro..." autocomplete="off">
        <div class="suggestions" id="mainSug"></div>
      </div>
      <button class="icon-btn gbar-side" id="btnClearSearch" title="Limpar" style="display:none;">✕</button>
    </div>

    <div class="sheet-page active" id="page-search">
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="place-card" id="placeCard" style="display:none;">
      <div class="place-card-cat" id="placeCat"></div>
      <div class="place-card-title" id="placeTitle"></div>
      <div class="place-card-actions">
        <button class="place-directions-btn" id="btnPlaceDirections">🧭 Rotas</button>
      </div>
    </div>

    <div class="sheet-page" id="page-route">
      <div class="stops-wrap">
        <div id="stopsList"></div>
        <button class="add-stop-btn" id="addStop">+ Adicionar parada</button>
        <button class="gps-btn" id="btnGps">📍 Usar minha localização como partida</button>
        <button class="trace-btn" id="btnTrace" disabled>Traçar rota</button>
        <div class="route-info" id="routeInfo"></div>
      </div>
    </div>
  </div>

  <div class="hud panel legend-overlay" id="legendOverlay" style="display:none;">
    <div class="legend-overlay-head">
      <span>Legenda</span>
      <button class="icon-btn" id="btnLegendClose">✕</button>
    </div>
    <div class="legend-list" id="legendList"></div>
  </div>

  <div class="hud panel legend-overlay" id="configOverlay" style="display:none;">
    <div class="legend-overlay-head">
      <span>Configurações</span>
      <button class="icon-btn" id="btnConfigClose">✕</button>
    </div>
    <div class="config-list">
      <label class="config-row" style="margin-bottom:14px">
        <input type="checkbox" id="cfgEscuro">
        <span>
          <b>Modo escuro</b>
          <em>Desligado, o mapa e os painéis ficam claros. Sem marcar nada, segue o tema do seu aparelho.</em>
        </span>
      </label>
      <label class="config-row" style="margin-bottom:14px">
        <input type="checkbox" id="cfgSemGps">
        <span>
          <b>Desativar GPS</b>
          <em>Esconde o botão de localização e para de acompanhar sua posição.</em>
        </span>
      </label>
      <div style="font-size:11px;color:var(--ink-soft);margin:8px 0 14px;padding:8px 10px;background:var(--ground);border-radius:6px;line-height:1.5;">
        <b style="display:block;color:var(--ink);margin-bottom:2px;">Diagnóstico do GPS</b>
        <span id="gpsDiag">ainda não testado</span>
      </div>
      <label class="config-row">
        <input type="checkbox" id="cfgPartidaFixa">
        <span>
          <b>Partida sempre na Chama Crioula</b>
          <em>Ao escolher um lugar, a rota é traçada na hora saindo do Piquete da Prefeitura. Você só escolhe o destino.</em>
        </span>
      </label>
    </div>
  </div>

  <div class="fab-col hud">
    <button class="gps-fab" id="btnConfig" title="Configurações">⚙️</button>
    <button class="gps-fab" id="btnBase" title="Alternar entre o mapa oficial e o esquemático">🗺️</button>
    <button class="gps-fab" id="btnFit" title="Ver o mapa inteiro">⤢</button>
    <button class="gps-fab" id="btnGpsFab" title="Minha localização">📍</button>
    <div class="zoom-ctrl">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  window.addEventListener('error', (ev)=>{
    const alvo = document.getElementById('toast');
    const msg = 'Erro: ' + (ev.message||ev.error) + ' (' + (ev.filename||'').split('/').pop() + ':' + ev.lineno + ')';
    if(alvo){ alvo.textContent = msg; alvo.classList.add('show'); }
    const d = document.getElementById('gpsDiag');
    if(d) d.textContent = msg;
  });
  if(!window.AF2026){
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="position:fixed;inset:0;z-index:999;background:#fff;color:#c0392b;font:14px Arial;padding:24px">' +
      'Não consegui carregar <b>data.js</b>.<br><br>Se você abriu o arquivo direto do computador, ' +
      'o navegador bloqueia esse carregamento. Abra pelo endereço do site (https).</div>');
    return;
  }
  const D = window.AF2026;

  // estado do GPS declarado cedo: o bloco de configuracoes roda antes do bloco de GPS
  // e chama pararGps(). Com 'let' la embaixo isso dava ReferenceError (temporal dead zone).
  let gpsPoint = null, gpsWatchId = null;

  // ============ pontos pesquisáveis ============
  const points = [];
  D.lots.forEach(l => points.push({
    kind:'lote', num:String(l.num), nome:l.nome, x:l.x, y:l.y,
  }));
  // tipo ("Loja", "Alimentação") so aparece na busca; no mapa fica so o nome curto
  D.landmarks.forEach(p => points.push({ kind:'poi', num:'', nome:p.nome, x:p.x, y:p.y, cat:p.cat, tipo:p.tipo, alias:p.alias }));

  const CAT_LABEL = {
    INST:'Institucional', PAT:'Patrocinador', IMPRENSA:'Imprensa', COMERCIO:'Comércio (alimentação)',
    PRACA_HAR:'Praça Harmonia (comércio)', CORREARIA:'Correaria', CUTELARIA:'Cutelaria',
  };
  const CAT_ANCHOR = {
    INST:[1600,1500], PAT:[1600,1560], IMPRENSA:[1350,2000], COMERCIO:[2500,1800],
    PRACA_HAR:[1500,1650], CORREARIA:[3450,1980], CUTELARIA:[3520,2020],
  };
  // As listas de categoria sao so nomes, sem posicao: entram numa ancora generica.
  // Quando o nome ja existe como lote ou marco (com posicao de verdade), nao criamos
  // um segundo ponto — so penduramos o rotulo da categoria no que ja existe.
  const porNome = new Map();
  points.forEach(p=> porNome.set(semAcento(p.nome), p));
  let catDedup = 0;
  Object.keys(D.categories).forEach(cat=>{
    D.categories[cat].forEach(nome=>{
      const existente = porNome.get(semAcento(nome));
      if(existente){
        if(!existente.catGroup) existente.catGroup = CAT_LABEL[cat];
        catDedup++;
        return;
      }
      const [ax,ay] = CAT_ANCHOR[cat];
      points.push({ kind:'cat', num:'', nome, x:ax+(Math.random()-0.5)*40, y:ay+(Math.random()-0.5)*40,
        catGroup: CAT_LABEL[cat], noExactPos:true });
    });
  });

  function displayName(p){
    if(p.kind==='lote') return p.nome ? `${p.num} — ${p.nome}` : `Lote ${p.num}`;
    return p.tipo ? `${p.tipo} ${p.nome}` : p.nome;
  }
  function semAcento(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  function matches(p,q){
    q=semAcento(q);
    // busca pelo nome exibido, entao "loja" lista todas as lojas e "sabia" acha "Loja Sabiá"
    // alias = sinonimos so pra busca ("banheiro" acha "Sanitarios"), nao aparecem no mapa
    return (p.num && p.num.includes(q)) || semAcento(displayName(p)).includes(q) || semAcento(p.alias).includes(q);
  }

  // ============ grafo de ruas ============
  const graph = {};
  function addNode(id){ if(!graph[id]) graph[id]=[]; }
  function addEdge(a,b,w){ addNode(a); addNode(b); graph[a].push({to:b,w}); graph[b].push({to:a,w}); }
  function dist(p1,p2){ return Math.hypot(p1[0]-p2[0], p1[1]-p2[1]); }

  Object.keys(D.roadNodes).forEach(addNode);
  D.roadEdges.forEach(([a,b])=> addEdge(a,b, dist(D.roadNodes[a],D.roadNodes[b])));

  points.forEach((p,idx)=>{
    const pid = 'PT_'+idx;
    p._nodeId = pid;
    addNode(pid);
    // liga cada ponto (lote/marco) a só o nó de rua mais próximo — uma única "porta de entrada".
    // com 2 ligações, o Dijkstra às vezes "atravessava" o lote como atalho entre duas ruas
    // (mais curto que contornar pela rua de verdade, mas impossível na prática).
    let best=null,bd=Infinity;
    Object.entries(D.roadNodes).forEach(([rid,pos])=>{ const d=dist([p.x,p.y],pos); if(d<bd){bd=d;best=rid;} });
    addEdge(pid, best, bd);
  });

  function dijkstra(startId, endId){
    const distMap={}, prev={}, visited=new Set();
    Object.keys(graph).forEach(k=> distMap[k]=Infinity);
    distMap[startId]=0;
    const pq=[[0,startId]];
    while(pq.length){
      pq.sort((a,b)=>a[0]-b[0]);
      const [d,u]=pq.shift();
      if(visited.has(u)) continue;
      visited.add(u);

      });
    }
    if(distMap[endId]===Infinity) return null;
    const path=[endId]; let cur=endId;
    while(cur!==startId){ cur=prev[cur]; path.unshift(cur); }
    return { path, dist: distMap[endId] };

  const VB0 = {x:100,y:800,w:6100,h:2350};

  function applyVB(){ svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`); }

  // O mapa e muito largo (2,6:1) e a tela do celular e alta (1:2,2). Com um viewBox fixo,
  // "meet" encolhia tudo pra caber na largura e sobrava tela vazia em cima e embaixo.
  // Aqui o viewBox passa a ter a mesma proporcao da tela, entao o mapa sempre preenche.
  function telaProp(){
    const r = svg.getBoundingClientRect();
    return (r.width && r.height) ? r.height / r.width : (VB0.h/VB0.w);
  }
  // mostra o mapa INTEIRO (sobra tela nas laterais ou em cima/embaixo)
  function enquadrarTudo(){
    const p = telaProp();
    const cx = VB0.x + VB0.w/2, cy = VB0.y + VB0.h/2;
    let w = VB0.w, h = w * p;
    if(h < VB0.h){ h = VB0.h; w = h / p; }
    VB.w = w; VB.h = h; VB.x = cx - w/2; VB.y = cy - h/2;
    applyVB();
  }
  // PREENCHE a tela: em celular na vertical o mapa e largo demais pra caber legivel,
  // entao entra encaixado na altura e o usuario arrasta pros lados.
  // Abre centralizado na Chama Crioula (Piquete da Prefeitura), que e o ponto de
  // referencia de quem atende no balcao de informacoes.
  const FOCO_INICIAL = 'Chama Crioula';
  function preencherTela(){
    const p = telaProp();
    let h = VB0.h, w = h / p;
    if(w > VB0.w){ w = VB0.w; h = w * p; }
    const foco = (D.landmarks||[]).find(l=>l.nome===FOCO_INICIAL);
    let cx = foco ? foco.x : VB0.x + VB0.w/2;
    let cy = foco ? foco.y : VB0.y + VB0.h/2;
    // nao deixa a vista sair da area do mapa
    if(w < VB0.w) cx = Math.min(Math.max(cx, VB0.x + w/2), VB0.x + VB0.w - w/2);
    else cx = VB0.x + VB0.w/2;
    if(h < VB0.h) cy = Math.min(Math.max(cy, VB0.y + h/2), VB0.y + VB0.h - h/2);
    else cy = VB0.y + VB0.h/2;
    VB.w = w; VB.h = h; VB.x = cx - w/2; VB.y = cy - h/2;
    applyVB();
  }
  // tela em retrato (celular/tablet em pe) começa preenchendo, senao o mapa vira uma tira.

    const nh = nw * (VB.h/VB.w);
    VB.x = anchor.x - (anchor.x-VB.x)*(nw/VB.w);
    VB.y = anchor.y - (anchor.y-VB.y)*(nh/VB.h);
    VB.w = nw; VB.h = nh;

  }, {passive:true});

  // ---- reordenar paradas arrastando pela alça ----

  let arrastando = null;
  function ligarArraste(){
    stopsList.querySelectorAll('.stop-grip').forEach(grip=>{
      grip.addEventListener('pointerdown', (ev)=>{
        ev.preventDefault();
        const row = grip.closest('.stop-row');
        arrastando = { de: parseInt(row.dataset.i,10), row };
        row.classList.add('arrastando');
        grip.setPointerCapture(ev.pointerId);
      });
      grip.addEventListener('pointermove', (ev)=>{
        if(!arrastando) return;
        const alvo = indiceEm(ev.clientY);
        stopsList.querySelectorAll('.stop-row').forEach(r=>r.classList.remove('alvo'));
        if(alvo!=null && alvo!==arrastando.de){
          const r = stopsList.querySelector(`.stop-row[data-i="${alvo}"]`);
          if(r) r.classList.add('alvo');
        }
      });
      const soltar = (ev)=>{
        if(!arrastando) return;
        const de = arrastando.de, para = indiceEm(ev.clientY);
        arrastando.row.classList.remove('arrastando');
        stopsList.querySelectorAll('.stop-row').forEach(r=>r.classList.remove('alvo'));
        arrastando = null;
        if(para!=null && para!==de){

          renderStops(); renderStopMarkers(); updateTraceBtn();
          if(rotaTracada) tracarRota();
          toast('Ordem das paradas atualizada.');

      };
      grip.addEventListener('pointerup', soltar);
      grip.addEventListener('pointercancel', soltar);
    });

  function indiceEm(clientY){
    const linhas = [...stopsList.querySelectorAll('.stop-row')];
    for(const r of linhas){
      const c = r.getBoundingClientRect();
      if(clientY >= c.top && clientY <= c.bottom) return parseInt(r.dataset.i,10);
    }
    if(!linhas.length) return null;
    const prim = linhas[0].getBoundingClientRect();
    if(clientY < prim.top) return 0;
    return linhas.length-1;
  }

  function updateTraceBtn(){
    const filled = stops.filter(Boolean);
    document.getElementById('btnTrace').disabled = filled.length < 2;
  }

  // pino estilo Google Maps: bulbo redondo + ponta, apontando exatamente pro local (s.x,s.y = ponta)
  function pinPath(cx,cy,R){
    const by = cy - R*1.7; // centro do bulbo
    return `M ${cx-R} ${by} A ${R} ${R} 0 1 1 ${cx+R} ${by} Q ${cx+R} ${by+R*1.1} ${cx} ${cy} Q ${cx-R} ${by+R*1.1} ${cx-R} ${by} Z`;
  }
  function renderStopMarkers(){
    layerStops.innerHTML='';
    stops.forEach((s,i)=>{
      if(!s) return;
      const color = colorFor(i,stops.length);
      const letter = i===0?'A':(i===stops.length-1?String.fromCharCode(65+stops.length-1):String(i+1));
      const R = 18, by = s.y - R*1.7;
      const g = el('g',{class:'stop-marker'});
      g.appendChild(el('path',{class:'pin', d:pinPath(s.x,s.y,R), fill:color}));
      const t = el('text',{x:s.x, y:by+7, 'font-size':18});
      t.textContent = letter; g.appendChild(t);
      layerStops.appendChild(g);
    });
  }

  function tracarRota(){
    const filled = stops.filter(Boolean);
    if(filled.length<2) return;
    let totalDist=0, fullPath=[], ok=true, segInfo=[];
    for(let i=0;i<filled.length-1;i++){
      const r = dijkstra(filled[i]._nodeId, filled[i+1]._nodeId);
      if(!r){ ok=false; break; }
      totalDist += r.dist;
      segInfo.push({from:filled[i], to:filled[i+1], dist:r.dist});
      const segPts = r.path.map(nodePos);
      fullPath = fullPath.concat(i===0?segPts:segPts.slice(1));
    }
    const info = document.getElementById('routeInfo');
    if(!ok){
      routeLine.classList.remove('show');
      rotaTracada = false;
      info.classList.add('show');
      info.innerHTML = 'Não foi possível calcular a rota entre esses pontos.';
      return;
    }
    const ptsStr = fullPath.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    routeLine.setAttribute('points', ptsStr);
    routeLine.classList.add('show');
    rotaTracada = true;
    const meters = Math.round(totalDist * 0.1124);
    const minutes = Math.max(1, Math.round(meters/80)); // ~4.8km/h caminhando
    let stepsHtml = segInfo.map(s=> `<li>${displayName(s.from)} → ${displayName(s.to)}</li>`).join('');
    info.classList.add('show');
    info.innerHTML = `<b>${meters} m</b> · ~${minutes} min a pé<ul class="route-steps">${stepsHtml}</ul>`;
    // enquadra a rota
    const xs = fullPath.map(p=>p[0]), ys = fullPath.map(p=>p[1]);
    const pad = 200;
    const x0=Math.min(...xs)-pad, x1=Math.max(...xs)+pad, y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
    const r0 = svg.getBoundingClientRect(); const prop = r0.height/r0.width || (VB.h/VB.w);
    VB.w = Math.max(x1-x0, 300); VB.h = VB.w*prop;
    if(VB.h < (y1-y0)){ VB.h = y1-y0; VB.w = VB.h/prop; }
    VB.x = (x0+x1)/2 - VB.w/2; VB.y = (y0+y1)/2 - VB.h/2;
    applyVB();
  }
  document.getElementById('btnTrace').addEventListener('click', tracarRota);

  function pararGps(){
    if(gpsWatchId!=null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; }
  }

  // ============ configurações ============
  // partida fixa: quem atende no balcão de informações escolhe só o destino,
  // a rota já sai do Piquete da Prefeitura (Chama Crioula).
  const PARTIDA_FIXA = 'Chama Crioula';
  const configOverlay = document.getElementById('configOverlay');
  const cfgPartidaFixa = document.getElementById('cfgPartidaFixa');
  function pontoPartidaFixa(){ return points.find(p=>p.kind==='poi' && p.nome===PARTIDA_FIXA); }
  function partidaFixaLigada(){ return cfgPartidaFixa.checked; }
  function aplicaPartidaFixa(){
    const origem = pontoPartidaFixa();
    if(cfgPartidaFixa.checked){
      if(origem) stops[0] = origem;
    } else if(stops[0] && stops[0].nome===PARTIDA_FIXA){
      stops[0] = null;
    }
    renderStops(); renderStopMarkers(); updateTraceBtn();
    try{ localStorage.setItem('af2026_partida_fixa', cfgPartidaFixa.checked?'1':'0'); }catch(e){}
  }
  try{ cfgPartidaFixa.checked = localStorage.getItem('af2026_partida_fixa')==='1'; }catch(e){}
  cfgPartidaFixa.addEventListener('change', ()=>{
    aplicaPartidaFixa();
    toast(cfgPartidaFixa.checked ? 'Partida fixa na Chama Crioula ligada.' : 'Partida fixa desligada.');
  });
  const cfgSemGps = document.getElementById('cfgSemGps');
  function aplicaGps(){
    const off = cfgSemGps.checked;
    document.getElementById('btnGpsFab').style.display = off ? 'none' : 'flex';
    document.getElementById('btnGps').style.display = off ? 'none' : 'flex';
    if(off){ pararGps(); gpsPoint=null; drawGpsDot(); }
    try{ localStorage.setItem('af2026_sem_gps', off?'1':'0'); }catch(e){}
  }
  try{ cfgSemGps.checked = localStorage.getItem('af2026_sem_gps')==='1'; }catch(e){}
  cfgSemGps.addEventListener('change', ()=>{
    aplicaGps();
    toast(cfgSemGps.checked ? 'GPS desativado.' : 'GPS reativado.');
  });
  aplicaGps();

  document.getElementById('btnConfig').addEventListener('click', ()=>{
    configOverlay.style.display = configOverlay.style.display==='none' ? 'block' : 'none';
  });
  document.getElementById('btnConfigClose').addEventListener('click', ()=> configOverlay.style.display='none');

  // ============ GPS ============
  // transformacao afim lat/lng -> coordenadas locais do mapa, calibrada por minimos quadrados
  // com 10 pontos reais (pegos no Google Maps) comparados com a posicao deles no nosso mapa.
  // erro medio ficou em torno de 85 unidades (~1 lote de largura) - poderia melhorar com mais pontos.
  const GPS_FIT = {
    x: [812373.456, -29776.297, 40731491.4],
    y: [-120266.787, -1041075.070, -37435236.609],
  };
  function gpsToLocal(lat,lng){
    const x = GPS_FIT.x[0]*lng + GPS_FIT.x[1]*lat + GPS_FIT.x[2];
    const y = GPS_FIT.y[0]*lng + GPS_FIT.y[1]*lat + GPS_FIT.y[2];
    return { x, y };
  }
  // Diagnostico do GPS: fica visivel nas configuracoes pra dar pra saber exatamente
  // o que aconteceu quando ele nao encontra a posicao.
  let gpsDiag = 'ainda não testado';
  function setDiag(txt){
    gpsDiag = txt;
    const el2 = document.getElementById('gpsDiag');
    if(el2) el2.textContent = txt;
  }
  function startGps(onFirstFix){
    if(!navigator.geolocation){
      setDiag('este navegador não tem geolocalização');
      toast('Geolocalização não disponível neste navegador.'); return;
    }
    // o navegador bloqueia geolocalizacao fora de HTTPS (file:// e http:// comum)
    if(!window.isSecureContext){
      setDiag('bloqueado: a página não está em HTTPS (' + location.protocol + ')');
      toast('O navegador só libera GPS em HTTPS. Abra o site pelo endereço https, não pelo arquivo.');
      return;
    }
    if(gpsWatchId!=null) return;
    setDiag('procurando sinal…');
    gpsWatchId = navigator.geolocation.watchPosition((pos)=>{
      const {latitude:lat, longitude:lng, accuracy:acc} = pos.coords;
      const {x,y} = gpsToLocal(lat,lng);
      const dentro = Number.isFinite(x) && Number.isFinite(y) &&
        x >= VB0.x-800 && x <= VB0.x+VB0.w+800 && y >= VB0.y-800 && y <= VB0.y+VB0.h+800;
      setDiag(`${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(acc)} m) → mapa ${Math.round(x)}, ${Math.round(y)}` +
              (dentro ? ' — dentro do parque' : ' — FORA dos limites do mapa'));
      if(!dentro){
        gpsPoint = null; drawGpsDot();
        toast('Sua posição caiu fora dos limites do mapa. Veja o diagnóstico em ⚙️ Configurações.');
        return;
      }
      gpsPoint = { kind:'gps', nome:'Minha localização', x, y, num:'' };
      drawGpsDot();
      if(onFirstFix){ onFirstFix(); onFirstFix=null; }
    }, (err)=>{
      const motivos = {1:'permissão negada', 2:'posição indisponível (sem sinal)', 3:'tempo esgotado'};
      setDiag('erro: ' + (motivos[err.code] || err.message));
      toast('Não foi possível obter sua localização: ' + (motivos[err.code] || err.message) + '.');
    }, { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
  }
  function drawGpsDot(){
    layerGps.innerHTML='';
    if(!gpsPoint) return;
    layerGps.appendChild(el('circle',{class:'gps-dot-outer', cx:gpsPoint.x, cy:gpsPoint.y, r:70}));
    layerGps.appendChild(el('circle',{class:'gps-dot-inner', cx:gpsPoint.x, cy:gpsPoint.y, r:18}));
  }
  function useGpsForStopA(){
    startGps(()=>{
      if(!gpsPoint){ toast('Aguardando sinal de GPS…'); return; }
      // liga o ponto GPS na malha viária
      addNode(gpsPoint._nodeId = 'GPS_NODE');
      let best=null,bd=Infinity;
      Object.entries(D.roadNodes).forEach(([rid,pos])=>{ const d=dist([gpsPoint.x,gpsPoint.y],pos); if(d<bd){bd=d;best=rid;} });
      graph['GPS_NODE'] = [];
      addEdge('GPS_NODE', best, bd);
      stops[0] = gpsPoint;
      renderStops(); renderStopMarkers(); updateTraceBtn();
      flyTo(gpsPoint.x, gpsPoint.y, 900);
      toast('Localização atual definida como partida.');
    });
  }
  document.getElementById('btnGps').addEventListener('click', ()=>{ showTab('route'); useGpsForStopA(); });
  document.getElementById('btnGpsFab').addEventListener('click', ()=>{
    startGps(()=>{ if(gpsPoint) flyTo(gpsPoint.x, gpsPoint.y, 900); });
    toast('Localizando… (aproximado — beta)');
  });

  // ============ mapa oficial x esquemático ============
  const btnBase = document.getElementById('btnBase');
  let iconesCarregados = false;
  function carregarIconesEsquematicos(){
    if(iconesCarregados) return;
    iconesCarregados = true;
    svg.querySelectorAll('image[data-src]').forEach(img=>{
      const u = img.dataset.src;
      img.setAttributeNS('http://www.w3.org/1999/xlink','href',u);
      img.setAttribute('href',u);
      delete img.dataset.src;
    });
  }
  function aplicaBase(esquematico){
    if(esquematico) carregarIconesEsquematicos();
    svg.classList.toggle('modo-esquematico', esquematico);
    btnBase.textContent = esquematico ? '🖼️' : '🗺️';
    btnBase.title = esquematico ? 'Ver o mapa oficial' : 'Ver o mapa esquemático';
    try{ localStorage.setItem('af2026_base', esquematico?'esq':'oficial'); }catch(e){}
  }
  aplicaBase((()=>{ try{ return localStorage.getItem('af2026_base')==='esq'; }catch(e){ return false; } })());
  btnBase.addEventListener('click', ()=> aplicaBase(!svg.classList.contains('modo-esquematico')));

  // ============ tema claro/escuro (manual, além do automático por sistema) ============
  const cfgEscuro = document.getElementById('cfgEscuro');
  function applyTheme(t){
    if(t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    // localStorage lanca excecao em file:// e com dados de site bloqueados
    try{ t ? localStorage.setItem('af2026_theme', t) : localStorage.removeItem('af2026_theme'); }catch(e){}
  }
  const temaSalvo = (()=>{ try{ return localStorage.getItem('af2026_theme'); }catch(e){ return null; } })();
  applyTheme(temaSalvo);
  // sem preferencia salva, o checkbox reflete o tema do proprio aparelho
  cfgEscuro.checked = temaSalvo ? temaSalvo==='dark'
                                : matchMedia('(prefers-color-scheme: dark)').matches;
  cfgEscuro.addEventListener('change', ()=>{
    applyTheme(cfgEscuro.checked ? 'dark' : 'light');
    toast(cfgEscuro.checked ? 'Modo escuro ligado.' : 'Modo claro ligado.');
  });

  // ============ busca / autocomplete ============
  function positionSuggestions(input, sugEl){
    const r = input.getBoundingClientRect();
    sugEl.style.left = r.left+'px';
    sugEl.style.top = (r.bottom+4)+'px';
    sugEl.style.width = r.width+'px';
  }
  function setupAutocomplete(input, sugEl, onPick){
    let active=-1, items=[];
    input.addEventListener('input', ()=>{
      const q = input.value.trim();
      if(!q){ sugEl.classList.remove('open'); return; }
      positionSuggestions(input, sugEl);
      items = points.filter(p=>matches(p,q) && !p.noExactPos).slice(0,40);
      const catItems = points.filter(p=>p.noExactPos && matches(p,q)).slice(0,10);
      items = items.concat(catItems);
      sugEl.innerHTML='';
      items.forEach(p=>{
        const d = document.createElement('div'); d.className='item';
        d.innerHTML = `<span class="n">${p.num||''}</span><span class="nm">${p.tipo?p.tipo+' ':''}${p.nome}</span><span class="tag">${p.catGroup||p.kind}</span>`;
        d.addEventListener('mousedown',(e)=>{ e.preventDefault(); pick(p); });
        sugEl.appendChild(d);
      });
      active=-1; sugEl.classList.toggle('open', items.length>0);
    });
    input.addEventListener('keydown',(e)=>{
      if(!sugEl.classList.contains('open')) return;
      if(e.key==='ArrowDown'){ active=Math.min(active+1,items.length-1); paint(); e.preventDefault(); }
      else if(e.key==='ArrowUp'){ active=Math.max(active-1,0); paint(); e.preventDefault(); }
      else if(e.key==='Enter'){ if(active>=0){ pick(items[active]); e.preventDefault(); } }
      else if(e.key==='Escape'){ sugEl.classList.remove('open'); }
    });
    input.addEventListener('blur', ()=> setTimeout(()=>sugEl.classList.remove('open'),120));
    function paint(){ [...sugEl.children].forEach((c,i)=> c.classList.toggle('active', i===active)); }
    function pick(p){ input.value = displayName(p); sugEl.classList.remove('open'); onPick(p); }
  }

  const mainSearch = document.getElementById('mainSearch');
  const mainSug = document.getElementById('mainSug');
  const searchResults = document.getElementById('searchResults');
  mainSearch.addEventListener('input', ()=>{
    const q = mainSearch.value.trim();
    // a barra de busca fica sempre visivel, mas os resultados vivem na aba de busca.
    // Se o usuario digitar com a aba de rota aberta, os resultados ficariam escondidos.
    if(q && currentTab !== 'search') showTab('search');
    searchResults.innerHTML=''; mainSug.classList.remove('open');
    placeCard.style.display = 'none';
    btnClearSearch.style.display = q ? 'flex' : 'none';
    if(!q) return;
    const found = points.filter(p=>matches(p,q)).slice(0,60);
    if(found.length===0){ searchResults.innerHTML = '<div class="result-row">Nada encontrado.</div>'; return; }
    found.forEach(p=>{
      const row = document.createElement('div'); row.className='result-row';
      row.innerHTML = `<span>${p.num?`<b>${p.num}</b> — `:''}${p.tipo?p.tipo+' ':''}${p.nome}</span><span style="color:var(--ink-soft);font-size:11px">${p.catGroup||(p.kind==='lote'?'lote':'')}</span>`;
      row.addEventListener('click', ()=> onMapPick(p));
      searchResults.appendChild(row);
    });
  });

  let selectedPlace = null;
  const catNiceLabel = { lote:'Piquete', service:'Serviço', public:'Institucional / patrocinador', food:'Alimentação / lazer',
    shop:'Loja / feira', market:'Mercado', agro:'Agricultura familiar', media:'Imprensa', stage:'Palco', park:'Estacionamento' };
  function onMapPick(p){
    // com partida fixa ligada, escolher um lugar ja vira rota: so o destino e escolhido
    if(partidaFixaLigada() && p.nome !== PARTIDA_FIXA){
      const origem = pontoPartidaFixa();
      if(origem){
        stops = [origem, p];
        searchResults.innerHTML = '';
        mainSug.classList.remove('open');
        placeCard.style.display = 'none';
        showTab('route');
        renderStops(); renderStopMarkers(); updateTraceBtn();
        tracarRota();
        return;
      }
    }
    if(!p.noExactPos) flyTo(p.x, p.y, 700);
    selectedPlace = p;
    document.getElementById('placeTitle').textContent = displayName(p);
    document.getElementById('placeCat').textContent = catNiceLabel[p.cat] || p.catGroup || (p.kind==='lote' ? 'Piquete' : '');
    placeCard.style.display = 'block';
    searchResults.innerHTML = '';
    mainSug.classList.remove('open');
  }
  document.getElementById('btnPlaceDirections').addEventListener('click', ()=>{
    if(!selectedPlace) return;
    let idx = stops.findIndex(s=>!s);
    if(idx===-1) idx = stops.length-1;
    stops[idx] = selectedPlace;
    showTab('route');
    renderStops(); renderStopMarkers(); updateTraceBtn();
  });

  // primeira renderização
  if(cfgPartidaFixa.checked) aplicaPartidaFixa();
  renderStopMarkers();
})();
</script>
