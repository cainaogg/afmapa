<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapa do Acampamento Farroupilha 2026</title>
<meta name="description" content="Mapa interativo do Acampamento Farroupilha 2026 — busque piquetes por número ou nome e trace a rota mais rápida.">
<meta name="theme-color" content="#1a5c3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@400;600;700&family=Roboto+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#f2efe9; --panel:#ffffff; --ink:#1f2225; --ink-soft:#5f6368; --line:#dcdcdc;
  --road-fill:#ffffff; --road-fill-minor:#fbfaf8; --road-casing:#d4d0c4; --road-label:#7a7566;
  --lot-fill:#ffffff; --lot-border:#c9c5b8; --lot-text:#3c3a33;
  --accent:#1a5c3a; --accent-ink:#ffffff;
  --waypoint-a:#1a5c3a; --waypoint-b:#c0392b; --waypoint-mid:#e8710a;
  --shadow: 0 2px 10px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.1);
  --gps:#1a73e8;
  --cat-service:#e8748e; --cat-public:#5b8def; --cat-food:#c9863f; --cat-shop:#6b6b6b;
  --cat-market:#e0791f; --cat-agro:#c9a30d; --cat-media:#1e8e3e; --cat-stage:#c0286b;
  --cat-park:#7a9e6f; --cat-special:#d4a017; --cat-water:#7fb3e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1b1d1f; --panel:#26282b; --ink:#e8eaed; --ink-soft:#9aa0a6; --line:#3c3f42;
    --road-fill:#2c2e30; --road-fill-minor:#232527; --road-casing:#3a3c3e; --road-label:#9aa0a6;
    --lot-fill:#2c2e30; --lot-border:#48494b; --lot-text:#d8d6cd;
    --accent:#4caf7d; --accent-ink:#0b1220; --shadow: 0 2px 10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#1b1d1f; --panel:#26282b; --ink:#e8eaed; --ink-soft:#9aa0a6; --line:#3c3f42;
  --road-fill:#2c2e30; --road-fill-minor:#232527; --road-casing:#3a3c3e; --road-label:#9aa0a6;
  --lot-fill:#2c2e30; --lot-border:#48494b; --lot-text:#d8d6cd;
  --accent:#4caf7d; --accent-ink:#0b1220; --shadow: 0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Roboto',Arial,sans-serif;overscroll-behavior:none;}
.app{position:relative;height:100vh;height:100dvh;overflow:hidden;}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
/* a arte oficial do PDF e o que o visitante ve; a camada desenhada por nos fica de reserva */
svg#map .esquematico{display:none;}
svg#map.modo-esquematico .base-oficial{display:none;}
svg#map.modo-esquematico .esquematico{display:inline;}

.hud{position:absolute;z-index:5;}
.panel{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);}

.icon-btn{width:38px;height:38px;border:none;border-radius:50%;background:none;color:var(--ink-soft);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
.icon-btn:hover{background:var(--ground);}
.icon-btn.active{background:var(--accent);color:var(--accent-ink);}

/* barra de busca estilo Google Maps */
.gbar{display:flex;align-items:center;gap:2px;padding:8px;flex:none;}
.gbar-side{flex:none;}
.gbar-input{flex:1;margin:0;}
.gbar-input input{border:none;background:none;padding:9px 4px;font-size:15px;}
.gbar-input input:focus{outline:none;}

/* search / route sheet */
.sheet{top:10px;left:10px;width:320px;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);display:flex;flex-direction:column;overflow:hidden;}
.sheet.collapsed{display:none;}
@media (max-width: 720px){
  /* busca no topo (perto da barra de endereco do navegador) e botoes embaixo,
     onde o polegar alcanca */
  .sheet{left:10px;right:10px;width:auto;top:10px;bottom:auto;max-height:62vh;}
}
.sheet-page{display:none;overflow:auto;flex:1;flex-direction:column;}
.sheet-page.active{display:flex;}

/* busca */
.search-wrap{padding:10px 12px;}
.search-row{position:relative;margin-bottom:8px;}

/* place card (estilo cartão de local do Google Maps) */
.place-card{padding:14px 16px 16px;border-top:1px solid var(--line);}
.place-card-cat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.place-card-title{font-family:'Roboto Condensed',sans-serif;font-size:19px;font-weight:700;margin-bottom:4px;}
.place-resp{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.4;}
.place-resp b{color:var(--ink);font-weight:600;}
.place-card-actions{display:flex;gap:8px;}
.place-aviso{margin-top:10px;font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--ground);border-radius:8px;padding:10px 12px;}
.place-directions-btn{padding:9px 16px;border:none;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;cursor:pointer;}

/* legenda como painel flutuante (aberto pelo hamburguer) */
.legend-overlay{top:10px;left:10px;width:300px;max-height:calc(100vh - 20px);overflow:auto;z-index:6;}
.legend-overlay-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-family:'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:14px;color:var(--ink-soft);}
@media (max-width: 720px){ .legend-overlay{left:10px;right:10px;width:auto;} }
.search-row input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);font-family:'Roboto',sans-serif;font-size:14px;}
.search-row input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.suggestions{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:260px;overflow:auto;box-shadow:var(--shadow);display:none;}
.suggestions.open{display:block;}
.suggestions .item{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.suggestions .item:hover,.suggestions .item.active{background:var(--ground);}
.suggestions .item .n{font-family:'Roboto Mono',monospace;font-weight:700;color:var(--accent);min-width:30px;}
.suggestions .item .nm{flex:1;}
.suggestions .item .tag{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.search-results{padding:0 12px 10px;}
.result-row{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
.result-row:hover{background:var(--ground);}
.result-row b{font-family:'Roboto Mono',monospace;color:var(--accent);}

/* rota / stops */
.stops-wrap{padding:12px;display:flex;flex-direction:column;gap:8px;flex:none;}
.stop-row{display:flex;align-items:center;gap:8px;}
.stop-dot{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);}
.stop-row input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);font-size:13.5px;}
.stop-remove{width:26px;height:26px;border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:16px;flex:none;}
.stop-grip{flex:none;width:20px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  cursor:grab;font-size:15px;line-height:1;touch-action:none;user-select:none;opacity:.55;}
.stop-grip:hover{opacity:1;}
.stop-row.arrastando{opacity:.45;}
.stop-row.alvo{box-shadow:0 -2px 0 var(--accent);}
.add-stop-btn{align-self:flex-start;background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;}
.trace-btn{padding:11px;border:none;border-radius:8px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;font-family:'Roboto',sans-serif;}
.trace-btn:disabled{opacity:.4;cursor:not-allowed;}
.gps-btn{padding:9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel);color:var(--gps);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;}
/* Depois de tracar, o painel encolhe pra uma barra de resumo e devolve a tela pro
   mapa (mesma ideia do Google Maps). "Editar" traz o editor de paradas de volta. */
.rota-resumo{display:none;align-items:center;gap:10px;padding:12px 14px;}
.rota-resumo-txt{flex:1;min-width:0;line-height:1.4;}
.rota-resumo-txt b{display:block;font-size:15px;color:var(--ink);}
.rota-resumo-txt span{display:block;font-size:11.5px;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rota-editar{flex:none;padding:8px 16px;border:1px solid var(--line);border-radius:20px;
  background:var(--panel);color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;}

.route-info{font-size:12.5px;color:var(--ink-soft);line-height:1.6;padding:0 2px;display:none;}
.route-info.show{display:block;}
.route-info b{color:var(--ink);}

.qr-overlay{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;}
.qr-box{width:min(340px,100%);overflow:hidden;}
.qr-body{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.qr-body svg{width:100%;max-width:280px;height:auto;background:#fff;border-radius:8px;display:block;}
.qr-url{font-size:11.5px;color:var(--ink-soft);word-break:break-all;text-align:center;line-height:1.5;}

.config-list{padding:12px 14px 14px;}
.config-row{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13px;line-height:1.45;}
.config-row input{margin-top:2px;width:17px;height:17px;flex:none;accent-color:var(--accent);cursor:pointer;}
.config-row b{display:block;font-weight:600;}
.config-row em{display:block;font-style:normal;color:var(--ink-soft);font-size:11.5px;margin-top:2px;}


/* zoom controls */
.fab-col{right:12px;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.zoom-ctrl{display:flex;flex-direction:column;box-shadow:var(--shadow);border-radius:10px;overflow:hidden;}
.zoom-ctrl button{width:44px;height:40px;border:none;background:var(--panel);color:var(--ink);font-size:20px;cursor:pointer;border-bottom:1px solid var(--line);}
.zoom-ctrl button:last-child{border-bottom:none;}
.gps-fab{width:44px;height:44px;border-radius:50%;border:none;background:var(--panel);box-shadow:var(--shadow);color:var(--gps);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
@media (max-width: 720px){
  /* com a busca no topo, a coluna de botoes volta pro canto inferior direito */
  .fab-col{bottom:14px;top:auto;gap:9px;}
  /* zoom com dois dedos ja resolve no toque: os botoes +/- so ocupariam espaco */
  .zoom-ctrl{display:none;}
}

.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:20px;font-size:12.5px;box-shadow:var(--shadow);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;}
.toast.show{opacity:1;}

/* favoritos */
.place-fav-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--panel);
  color:var(--ink-soft);font-size:19px;line-height:1;cursor:pointer;flex:none;}
.place-fav-btn.on{color:#e8a300;border-color:#e8a300;}
.fav-head{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;
  padding:10px 10px 6px;font-weight:700;}
.fav-vazio{padding:0 10px 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
/* estrela em cada linha da busca: favoritar sem precisar abrir o lugar */
.row-dir{display:flex;align-items:center;gap:9px;flex:none;}
.row-tag{color:var(--ink-soft);font-size:11px;}
.row-resp{display:block;color:var(--ink-soft);font-size:11px;margin-top:1px;}
.row-fav{border:none;background:none;color:var(--ink-soft);font-size:17px;line-height:1;
  cursor:pointer;padding:2px 0 2px 2px;flex:none;}
.row-fav.on{color:#e8a300;}

/* atalhos "mais perto daqui" */
.atalhos{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 4px;scrollbar-width:none;}
/* display:flex ganha da regra padrao de [hidden], entao precisa dizer de novo */
.atalhos[hidden]{display:none;}
.atalhos::-webkit-scrollbar{display:none;}
.atalho{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:16px;padding:6px 11px;font-size:12.5px;
  font-family:'Roboto',sans-serif;cursor:pointer;white-space:nowrap;}
.atalho:hover{background:var(--ground);}
.atalho:disabled{opacity:.5;cursor:progress;}
.atalho.ativo{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

/* menu do hamburguer: tudo que saiu da tela principal entra aqui */
.menu-list{padding:8px;display:flex;flex-direction:column;}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 10px;border:none;background:none;
  color:var(--ink);font-size:14px;font-family:'Roboto',sans-serif;text-align:left;cursor:pointer;
  border-radius:8px;}
.menu-item:hover{background:var(--ground);}
.menu-item .mi{font-size:17px;width:22px;text-align:center;flex:none;}

/* a seta ao lado da busca abre a lista de favoritos, como acesso rapido */
#btnFavToggle{transition:transform .18s;}
#btnFavToggle.aberto{transform:rotate(180deg);color:#e8a300;}

/* cartao da rota: no celular sobe de baixo e abre puxando pela alca (estilo Google Maps) */
.rota-card{position:absolute;z-index:7;left:10px;bottom:10px;width:320px;display:flex;flex-direction:column;
  overflow:hidden;max-height:calc(100dvh - 20px);}
.rota-alca{display:none;}
.rota-topo{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 14px;flex:none;}
.rota-passos{display:none;margin:0;padding:0 14px 14px 14px;list-style:none;overflow:auto;
  border-top:1px solid var(--line);padding-top:10px;}
.rota-card.aberta .rota-passos{display:block;}
.rota-passos li{display:flex;gap:10px;padding:8px 0;font-size:13px;line-height:1.45;border-bottom:1px solid var(--line);}
.rota-passos li:last-child{border-bottom:none;}
.rota-passos .ico{flex:none;width:22px;text-align:center;font-size:15px;color:var(--accent);}
.rota-passos .dist{color:var(--ink-soft);font-size:11.5px;}
@media (min-width: 721px){ .rota-passos{display:block;} }
@media (max-width: 720px){
  .rota-card{left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;max-height:78dvh;}
  .rota-alca{display:block;padding:12px 0 6px;cursor:grab;flex:none;}
  .rota-alca span{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto;}
  /* o dedo pega o cartao inteiro; so a lista de passos continua rolando normal */
  .rota-card{touch-action:none;}
  .rota-passos{touch-action:pan-y;max-height:calc(78dvh - 96px);}
  /* com o cartao da rota embaixo, os botoes sobem pra continuar alcancaveis */
  body.com-rota .fab-col{bottom:104px;}
}

/* programacao */
.prog-dias{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);flex:none;}
.prog-dia{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;
  padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap;line-height:1.3;text-align:center;}
.prog-dia b{display:block;font-size:13px;}
.prog-dia.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.prog-lista{padding:6px 12px 14px;overflow:auto;}
.prog-palco{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
  font-weight:700;margin:12px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.prog-ir{border:none;background:none;color:var(--accent);font-weight:700;font-size:11.5px;cursor:pointer;
  text-transform:none;letter-spacing:0;}
.prog-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4;}
.prog-item .h{flex:none;width:64px;font-family:'Roboto Mono',monospace;font-size:11.5px;color:var(--ink-soft);padding-top:1px;}
.prog-item.agora{background:rgba(26,92,58,.09);border-radius:6px;padding-left:6px;margin-left:-6px;}

/* --- map drawing --- */
.road-casing{fill:none;stroke:var(--road-casing);stroke-linecap:round;stroke-linejoin:round;}
.road-fill{fill:none;stroke:var(--road-fill);stroke-linecap:round;stroke-linejoin:round;}
.road-fill.minor{stroke:var(--road-fill-minor);}
.road-label{font-family:'Roboto Condensed',sans-serif;font-size:22px;fill:var(--road-label);font-weight:600;}
.lot{fill:var(--lot-fill);stroke:var(--lot-border);stroke-width:2;}
.lot-num{font-family:'Roboto Mono',monospace;fill:var(--lot-text);text-anchor:middle;pointer-events:none;}
.lot.special{fill:#fff3cd;stroke:var(--cat-special);stroke-width:3;}
.lot-hit{fill:transparent;cursor:pointer;}
.stop-marker .pin{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
.stop-marker text{fill:#fff;font-weight:700;text-anchor:middle;font-family:'Roboto',sans-serif;pointer-events:none;}
.poi-dot{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
.poi-label{font-family:'Roboto',sans-serif;fill:var(--ink);text-anchor:middle;font-weight:500;pointer-events:none;}
.gate-label{font-family:'Roboto Condensed',sans-serif;font-weight:700;fill:var(--accent);}
.route-line{fill:none;stroke:var(--gps);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 22;opacity:0;transition:opacity .25s ease;}
.route-line.show{opacity:1;animation:dash 1s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-48;}}
@media (prefers-reduced-motion: reduce){.route-line.show{animation:none;}}
.gps-dot-outer{fill:rgba(26,115,232,.22);}
.gps-dot-inner{fill:var(--gps);stroke:#fff;stroke-width:3;}
</style>
</head>
<body>
<div class="app">
  <svg id="map" viewBox="100 800 6100 2350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>

  <div class="hud panel sheet" id="sheet">
    <div class="gbar">
      <button class="icon-btn gbar-side" id="btnBack" title="Menu">☰</button>
      <div class="search-row gbar-input">
        <input type="text" id="mainSearch" placeholder="Buscar piquete, palco, banheiro..." autocomplete="off">
        <div class="suggestions" id="mainSug"></div>
      </div>
      <button class="icon-btn gbar-side" id="btnClearSearch" title="Limpar" style="display:none;">✕</button>
      <button class="icon-btn gbar-side" id="btnFavToggle" title="Meus favoritos">⌄</button>
    </div>

    <div class="sheet-page active" id="page-search">
      <div class="atalhos" id="atalhos"></div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="place-card" id="placeCard" style="display:none;">
      <div class="place-card-cat" id="placeCat"></div>
      <div class="place-card-title" id="placeTitle"></div>
      <div class="place-resp" id="placeResp" style="display:none;"></div>
      <div class="place-card-actions">
        <button class="place-directions-btn" id="btnPlaceDirections">🧭 Rotas</button>
        <button class="place-fav-btn" id="btnPlaceFav" title="Favoritar">☆</button>
      </div>
      <div class="place-aviso" id="placeAviso" style="display:none;">
        Este estabelecimento aparece na listagem do evento, mas o mapa oficial não
        marca onde ele fica — então não dá pra traçar a rota até ele.
      </div>
    </div>

    <div class="sheet-page" id="page-route">
      <div class="stops-wrap">
        <div id="stopsList"></div>
        <button class="add-stop-btn" id="addStop">+ Adicionar parada</button>
        <button class="gps-btn" id="btnGps">📍 Usar minha localização como partida</button>
        <button class="trace-btn" id="btnTrace" disabled>Traçar rota</button>
        <div class="route-info" id="routeInfo"></div>
      </div>
    </div>
  </div>

  <!-- Depois de tracar, a rota vira um cartao proprio: no celular ele sobe de baixo e
       abre puxando pela alca, e a barra de busca continua livre no topo. -->
  <div class="hud panel rota-card" id="rotaCard" style="display:none;">
    <div class="rota-alca" id="rotaAlca"><span></span></div>
    <div class="rota-topo">
      <div class="rota-resumo-txt">
        <b id="resumoDist"></b>
        <span id="resumoTrajeto"></span>
      </div>
      <button class="rota-editar" id="btnEditarRota">Editar</button>

<!-- ?v=N: sem isso o navegador serve o data.js velho do cache e os lugares voltam pro lugar errado.
     BUMPAR ESSE NUMERO SEMPRE QUE MEXER NO data.js. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/chama_crioula.png">
<link rel="apple-touch-icon" href="icons/chama_crioula.png">
<script src="data.js?v=5"></script>
<script src="programacao.js?v=1"></script>
<script>
(function(){
  "use strict";
  window.addEventListener('error', (ev)=>{
    const alvo = document.getElementById('toast');
    const msg = 'Erro: ' + (ev.message||ev.error) + ' (' + (ev.filename||'').split('/').pop() + ':' + ev.lineno + ')';
    if(alvo){ alvo.textContent = msg; alvo.classList.add('show'); }
    const d = document.getElementById('gpsDiag');
    if(d) d.textContent = msg;
  });
  if(!window.AF2026){
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="position:fixed;inset:0;z-index:999;background:#fff;color:#c0392b;font:14px Arial;padding:24px">' +
      'Não consegui carregar <b>data.js</b>.<br><br>Se você abriu o arquivo direto do computador, ' +
      'o navegador bloqueia esse carregamento. Abra pelo endereço do site (https).</div>');
    return;
  }
  const D = window.AF2026;

  // estado do GPS declarado cedo: o bloco de configuracoes roda antes do bloco de GPS
  // e chama pararGps(). Com 'let' la embaixo isso dava ReferenceError (temporal dead zone).
  let gpsPoint = null, gpsWatchId = null;

  // ============ pontos pesquisáveis ============
  const points = [];
  D.lots.forEach(l => points.push({
    kind:'lote', num:String(l.num), nome:l.nome, x:l.x, y:l.y, resp:l.resp,
    alias:l.alias, tambemChamado:l.tambemChamado,   // apelidos so pra busca
  }));
  // tipo ("Loja", "Alimentação") so aparece na busca; no mapa fica so o nome curto
  D.landmarks.forEach(p => points.push({ kind:'poi', num:'', nome:p.nome, x:p.x, y:p.y, cat:p.cat,
    tipo:p.tipo, alias:p.alias, tambemChamado:p.tambemChamado }));

  const CAT_LABEL = {
    INST:'Institucional', PAT:'Patrocinador', IMPRENSA:'Imprensa', COMERCIO:'Comércio (alimentação)',
    PRACA_HAR:'Praça Harmonia (comércio)', CORREARIA:'Correaria', CUTELARIA:'Cutelaria',
  };
  const CAT_ANCHOR = {
    INST:[1600,1500], PAT:[1600,1560], IMPRENSA:[1350,2000], COMERCIO:[2500,1800],
    PRACA_HAR:[1500,1650], CORREARIA:[3450,1980], CUTELARIA:[3520,2020],
  };
  // As listas de categoria sao so nomes, sem posicao: entram numa ancora generica.
  // Quando o nome ja existe como lote ou marco (com posicao de verdade), nao criamos
  // um segundo ponto — so penduramos o rotulo da categoria no que ja existe.
  const porNome = new Map();
  points.forEach(p=> porNome.set(semAcento(p.nome), p));
  // apelidos: a listagem do PDF abrevia ("Rbs", "Smed", "Gov. Do Estado"). Sem isso
  // eles viravam um ponto solto numa ancora inventada, longe do lugar de verdade.
  D.landmarks.forEach(l => (l.tambemChamado||[]).forEach(a=>{
    if(!porNome.has(semAcento(a))) porNome.set(semAcento(a), porNome.get(semAcento(l.nome)));
  }));
  let catDedup = 0;
  Object.keys(D.categories).forEach(cat=>{
    D.categories[cat].forEach(nome=>{
      const existente = porNome.get(semAcento(nome));
      if(existente){
        if(!existente.catGroup) existente.catGroup = CAT_LABEL[cat];
        catDedup++;
        return;
      }
      // Nao temos onde fica: o PDF lista o nome mas nao marca a posicao. Antes isso
      // caia numa ancora generica e a rota levava a pessoa pro lugar errado com
      // aparencia de certeza. Agora entra sem coordenada e sem rota.
      const [ax,ay] = CAT_ANCHOR[cat];
      points.push({ kind:'cat', num:'', nome, x:ax, y:ay,
        catGroup: CAT_LABEL[cat], noExactPos:true, semLocal:true });
    });
  });

  function displayName(p){
    if(p.kind==='lote') return p.nome ? `${p.num} — ${p.nome}` : `Lote ${p.num}`;
    return p.tipo ? `${p.tipo} ${p.nome}` : p.nome;
  }
  // tira acento E pontuacao: 'quero-quero', 'quero quero' e 'Quero Quero' viram a
  // mesma coisa, entao a busca nao depende de como a pessoa digita.
  function semAcento(s){
    return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                  .toLowerCase().replace(/[^a-z0-9]/g,'');
  }
  function matches(p,q){
    q=semAcento(q);
    // busca pelo nome exibido, entao "loja" lista todas as lojas e "sabia" acha "Loja Sabiá"
    // alias = sinonimos so pra busca ("banheiro" acha "Sanitarios"), nao aparecem no mapa
    if(p.num && p.num.includes(q)) return true;
    if(semAcento(displayName(p)).includes(q)) return true;
    if(semAcento(p.alias).includes(q)) return true;
    // responsavel: "quem cuida do 30?" e tambem "onde fica o piquete do Joao Batista?"
    if(p.resp && semAcento(p.resp).includes(q)) return true;
    // tambemChamado: nomes abreviados da listagem do PDF ("Guaiba Record", "Gov. Do Estado")
    return (p.tambemChamado||[]).some(a => semAcento(a).includes(q));
  }

  // ============ grafo de ruas ============
  const graph = {};
  function addNode(id){ if(!graph[id]) graph[id]=[]; }
  function addEdge(a,b,w){ addNode(a); addNode(b); graph[a].push({to:b,w}); graph[b].push({to:a,w}); }
  function dist(p1,p2){ return Math.hypot(p1[0]-p2[0], p1[1]-p2[1]); }

  Object.keys(D.roadNodes).forEach(addNode);
  D.roadEdges.forEach(([a,b])=> addEdge(a,b, dist(D.roadNodes[a],D.roadNodes[b])));

  // Nós de entrada criados em cima das ruas (ver abaixo). Ficam fora de D.roadNodes.
  const viaPos = {};      // id -> [x,y]
  const viaAresta = {};   // id -> [nóA, nóB] da rua onde ele foi criado

  // ponto mais próximo do segmento ab
  function projeta(p, a, b){
    const vx = b[0]-a[0], vy = b[1]-a[1];
    const len2 = vx*vx + vy*vy;
    if(!len2) return { pt:a.slice(), t:0 };
    let t = ((p[0]-a[0])*vx + (p[1]-a[1])*vy) / len2;
    t = Math.max(0, Math.min(1, t));
    return { pt:[a[0]+t*vx, a[1]+t*vy], t };
  }

  // Liga um ponto à RUA mais próxima, não ao NÓ mais próximo. O grafo é esparso
  // (a Rua Hugo da Cunha Alves tem 3 nós em 946 de comprimento), então o nó mais perto
  // de um lote no meio da quadra costuma estar do OUTRO LADO dela: a ligação atravessava
  // o lote vizinho e a rota mandava entrar pela rua errada. Era o caso de 69 dos 236
  // lotes — o 120 entrava pela Hugo da Cunha Alves cortando o 127, quando a porta dele
  // dá na Oliveira Silveira. A projeção vira um nó novo no meio da aresta, ligado às
  // duas pontas dela.
  // O segmento p-q corta a caixa de algum lote? (Liang-Barsky)
  const meioLote = { w: D.lotBoxSize.w/2, h: D.lotBoxSize.h/2 };
  function cortaCaixa(p, q, cx, cy){
    const x0 = cx-meioLote.w, x1 = cx+meioLote.w, y0 = cy-meioLote.h, y1 = cy+meioLote.h;
    let t0 = 0, t1 = 1;
    const dx = q[0]-p[0], dy = q[1]-p[1];
    const corta = (pp, qq)=>{
      if(pp === 0) return qq >= 0;
      const r = qq/pp;
      if(pp < 0){ if(r > t1) return false; if(r > t0) t0 = r; }
      else      { if(r < t0) return false; if(r < t1) t1 = r; }
      return true;
    };
    return corta(-dx, p[0]-x0) && corta(dx, x1-p[0]) && corta(-dy, p[1]-y0) && corta(dy, y1-p[1]);
  }
  function atravessaLote(p, q, meuNum){
    const minX = Math.min(p[0],q[0])-meioLote.w, maxX = Math.max(p[0],q[0])+meioLote.w;
    const minY = Math.min(p[1],q[1])-meioLote.h, maxY = Math.max(p[1],q[1])+meioLote.h;
    for(const l of D.lots){
      if(l.x < minX || l.x > maxX || l.y < minY || l.y > maxY) continue;  // fora da faixa
      if(meuNum != null && String(l.num) === meuNum) continue;
      if(cortaCaixa(p, q, l.x, l.y)) return true;
    }
    return false;
  }

  function ligaNaRua(pid, x, y, vid, meuNum){
    const cands = [];
    D.roadEdges.forEach(([ia,ib])=>{
      const a = D.roadNodes[ia], b = D.roadNodes[ib];
      if(!a || !b) return;
      const { pt } = projeta([x,y], a, b);
      cands.push({ d: dist([x,y], pt), pt, ia, ib });
    });
    if(!cands.length) return;
    cands.sort((p,q)=> p.d - q.d);
    // Entre as ruas mais próximas, fica com a primeira que dá pra alcançar sem passar
    // por dentro de outro lote. Sobra só o lote 215: a Rua Cyra Dutra Ferreira fica
    // 35 unidades mais perto em linha reta, mas essa reta atravessa o 217 — a porta
    // dele dá na Presidente Ademir de Morais, como todos os vizinhos de 203 a 214.
    let melhor = cands.find(c => !atravessaLote([x,y], c.pt, meuNum)) || cands[0];
    // caiu em cima de uma ponta: usa a ponta e não cria nó novo
    const da = dist(melhor.pt, D.roadNodes[melhor.ia]);
    const db = dist(melhor.pt, D.roadNodes[melhor.ib]);
    if(da < 1){ addEdge(pid, melhor.ia, melhor.d); return; }
    if(db < 1){ addEdge(pid, melhor.ib, melhor.d); return; }
    graph[vid] = [];                 // religar (GPS) não pode acumular arestas velhas
    viaPos[vid] = melhor.pt;
    viaAresta[vid] = [melhor.ia, melhor.ib];
    addEdge(vid, melhor.ia, da);
    addEdge(vid, melhor.ib, db);
    addEdge(pid, vid, melhor.d);
  }

  points.forEach((p,idx)=>{
    const pid = 'PT_'+idx;
    p._nodeId = pid;
    addNode(pid);
    ligaNaRua(pid, p.x, p.y, 'VIA_'+idx, p.kind==='lote' ? p.num : null);
  });

  function dijkstra(startId, endId){
    const distMap={}, prev={}, visited=new Set();
    Object.keys(graph).forEach(k=> distMap[k]=Infinity);
    distMap[startId]=0;
    const pq=[[0,startId]];
    while(pq.length){
      pq.sort((a,b)=>a[0]-b[0]);
      const [d,u]=pq.shift();
      if(visited.has(u)) continue;
      visited.add(u);
      if(u===endId) break;
      (graph[u]||[]).forEach(e=>{
        const nd=d+e.w;
        if(nd<distMap[e.to]){ distMap[e.to]=nd; prev[e.to]=u; pq.push([nd,e.to]); }
      });
    }
    if(distMap[endId]===Infinity) return null;
    const path=[endId]; let cur=endId;
    while(cur!==startId){ cur=prev[cur]; path.unshift(cur); }
    return { path, dist: distMap[endId] };
  }
  // Dijkstra sem destino: devolve a distância até todos os nós de uma vez. Usado pelos
  // atalhos "mais perto daqui" — 12 praças de alimentação seriam 12 buscas separadas.
  function distanciasDe(startId){
    const distMap = {}, visited = new Set();
    Object.keys(graph).forEach(k=> distMap[k] = Infinity);
    distMap[startId] = 0;
    const pq = [[0,startId]];
    while(pq.length){
      pq.sort((a,b)=>a[0]-b[0]);
      const [d,u] = pq.shift();
      if(visited.has(u)) continue;
      visited.add(u);
      (graph[u]||[]).forEach(e=>{
        const nd = d + e.w;
        if(nd < distMap[e.to]){ distMap[e.to] = nd; pq.push([nd, e.to]); }
      });
    }
    return distMap;
  }

  function nodePos(id){
    if(D.roadNodes[id]) return D.roadNodes[id];
    if(viaPos[id]) return viaPos[id];
    const idx = parseInt(id.replace('PT_',''),10);
    const p = points[idx];
    return [p.x,p.y];
  }

  // ============ render SVG ============
  const svg = document.getElementById('map');
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

  const layerBase=el('g',{class:'base-oficial'});
  const layerRoadCasing=el('g',{class:'esquematico'}), layerRoadFill=el('g',{class:'esquematico'}),
        layerLabels=el('g',{class:'esquematico'}), layerPois=el('g',{class:'esquematico'}),
        layerLots=el('g',{class:'esquematico'}), layerRoute=el('g',{}),
        layerStops=el('g',{}), layerGps=el('g',{}), layerHit=el('g',{});
  [layerBase,layerRoadCasing,layerRoadFill,layerLabels,layerPois,layerLots,layerRoute,layerStops,layerGps,layerHit]
    .forEach(l=>svg.appendChild(l));

  // ---- arte oficial do mapa (recortada do PDF) como fundo ----
  // as imagens estao em coordenadas do PDF; esta matriz converte pra coordenada local
  // (a mesma calibracao feita com os 236 lotes, erro medio de ~6 unidades).
  const PDF2LOCAL = 'matrix(0.958055 0.001596 -0.001984 0.959086 142.730119 -88.825191)';
  const BASE_PARTES = [
    { arquivo:'mapa/parte0.webp?v=2', raw:[0,820,3070,3360] },
    { arquivo:'mapa/parte1.webp?v=2', raw:[3070,820,6140,3360] },
  ];
  (function montaBase(){
    const g = el('g',{transform:PDF2LOCAL});
    BASE_PARTES.forEach(p=>{
      const [x0,y0,x1,y1] = p.raw;
      const img = el('image',{x:x0, y:y0, width:x1-x0, height:y1-y0,
                              preserveAspectRatio:'none'});
      img.setAttributeNS('http://www.w3.org/1999/xlink','href',p.arquivo);
      img.setAttribute('href', p.arquivo);
      g.appendChild(img);
    });
    layerBase.appendChild(g);
  })();

  D.roadEdges.forEach(([a,b])=>{
    const [x1,y1]=D.roadNodes[a], [x2,y2]=D.roadNodes[b];
    layerRoadCasing.appendChild(el('line',{class:'road-casing',x1,y1,x2,y2,'stroke-width':26}));
    layerRoadFill.appendChild(el('line',{class:'road-fill',x1,y1,x2,y2,'stroke-width':18}));
  });

  (D.streetLabels||[]).forEach(s=>{
    // encolhe a fonte pra caber o nome dentro do trecho de rua disponível (s.len),
    // sem passar de um tamanho máximo confortável de longe.
    // s.size vem calculado do data.js: leva em conta a LARGURA da rua, nao so o comprimento,
    // pra o texto nao transbordar pra cima dos lotes em viela estreita.
    let fontSize;
    if(s.size){
      fontSize = s.size;
    } else {
      const avail = (s.len||600) * 0.92;
      const CHAR_W = 0.56; // largura media de um caractere em Roboto Condensed semibold
      fontSize = Math.max(12, Math.min(24, avail / (s.text.length * CHAR_W)));
    }
    const t = el('text',{class:'road-label', x:s.x, y:s.y, 'text-anchor':'middle'});
    t.style.fontSize = fontSize.toFixed(1)+'px'; // inline pra ter prioridade sobre a regra .road-label do CSS
    if(s.rot) t.setAttribute('transform', `rotate(${s.rot} ${s.x} ${s.y})`);
    t.textContent = s.text;
    layerLabels.appendChild(t);
  });

  const catColorVar = { service:'--cat-service', public:'--cat-public', food:'--cat-food', shop:'--cat-shop',
    market:'--cat-market', agro:'--cat-agro', media:'--cat-media', stage:'--cat-stage', park:'--cat-park', special:'--cat-special', water:'--cat-water' };

  // desenha areas grandes (estacionamentos etc) primeiro, para ficarem atras dos outros pontos
  // semDesenho: existe no editor e na busca, mas nao aparece desenhado no mapa
  D.landmarks.filter(p=>p.shape==='poly' && p.behind && !p.semDesenho).forEach(p=>{
    const cv = catColorVar[p.cat] || '--cat-public';
    const ptsStr = p.points.map(([x,y])=>`${x},${y}`).join(' ');
    layerPois.appendChild(el('polygon',{class:'poi-area', points:ptsStr,
      fill:`var(${cv})`, opacity:.28, stroke:`var(${cv})`, 'stroke-width':3, 'stroke-dasharray':'14 10'}));
    const cx = p.points.reduce((s,pt)=>s+pt[0],0)/p.points.length;
    const cy = Math.min(...p.points.map(pt=>pt[1])) - 14;
    const t = el('text',{class:'poi-label', x:cx, y:cy, 'font-size':20});
    t.textContent = p.nome; layerPois.appendChild(t);
  });
  D.landmarks.filter(p=>p.shape==='rect' && p.behind && !p.semDesenho).forEach(p=>{
    const cv = catColorVar[p.cat] || '--cat-public';
    layerPois.appendChild(el('rect',{class:'poi-area', x:p.x-p.w/2, y:p.y-p.h/2, width:p.w, height:p.h, rx:14,
      fill:`var(${cv})`, opacity:.28, stroke:`var(${cv})`, 'stroke-width':3, 'stroke-dasharray':'14 10'}));
    const t = el('text',{class:'poi-label', x:p.x, y:p.y-p.h/2-14, 'font-size':20});
    t.textContent = p.nome; layerPois.appendChild(t);
  });

  // tudo que ja foi desenhado no passo de areas de fundo (poly ou rect com behind) fica de fora,
  // senao o marco seria desenhado de novo como ponto solto.
  D.landmarks.filter(p=>!p.behind && !p.semDesenho).forEach(p=>{
    const cv = catColorVar[p.cat] || '--cat-public';
    if(p.icon){
      // arte redonda recortada do mapa oficial (pasta icons/)
      const s = p.iconSize || 120;
      // href fica guardado em data-src: no modo oficial esses icones ficam escondidos
      // (a arte do PDF ja os mostra) e baixa-los seria ~1,5 MB de dados a toa no celular.
      const img = el('image',{x:p.x-s/2, y:p.y-s/2, width:s, height:s});
      img.dataset.src = 'icons/'+p.icon+'.png';
      layerPois.appendChild(img);
      const t = el('text',{class:'poi-label', x:p.x, y:p.y+s/2+22, 'font-size':18});
      t.textContent = p.nome; layerPois.appendChild(t);
      return;
    }
    if(p.shape==='rect'){
      layerPois.appendChild(el('rect',{class:'poi-area', x:p.x-p.w/2, y:p.y-p.h/2, width:p.w, height:p.h, rx:8,
        fill:`var(${cv})`, opacity:.75, stroke:'#fff', 'stroke-width':2}));
      const t = el('text',{class:'poi-label', x:p.x, y:p.y, 'font-size':17, fill:'#fff'});
      t.textContent = p.nome; layerPois.appendChild(t);
      return;
    }
    const r = p.cat==='stage' ? 26 : (p.cat==='special'? 24 : 16);
    layerPois.appendChild(el('circle',{class:'poi-dot', cx:p.x, cy:p.y, r, fill:'#fff', stroke:`var(${cv})`, 'stroke-width':5}));
    const t = el('text',{class:'poi-label', x:p.x, y:p.y+r+22, 'font-size': p.cat==='special'?24:18});
    t.textContent = p.nome; layerPois.appendChild(t);
  });

  D.gates.forEach(([rid,name])=>{
    const [x,y] = D.roadNodes[rid];
    layerPois.appendChild(el('circle',{class:'poi-dot',cx:x,cy:y,r:14,fill:'#fff',stroke:'var(--gps)','stroke-width':5}));
    const t = el('text',{class:'gate-label', x, y:y-22, 'text-anchor':'middle', 'font-size':22});
    t.textContent = name; layerPois.appendChild(t);
  });

  // lotes no mapa real 2026 sao circulos, com espacamento medio real de ~88 unidades entre vizinhos
  const lotRadius = 38;
  points.filter(p=>p.kind==='lote').forEach(p=>{
    const r = p.r || lotRadius;
    const box = el('circle',{class:'lot'+(p.special?' special':''), cx:p.x, cy:p.y, r});
    const label = el('text',{class:'lot-num', x:p.x, y:p.y+7, 'font-size':18});
    label.textContent = p.num;
    layerLots.appendChild(box); layerLots.appendChild(label);
    p._boxEl = box;
    const hit = el('circle',{class:'lot-hit', cx:p.x, cy:p.y, r:r+3});
    hit.addEventListener('click', ()=> onMapPick(p));
    layerHit.appendChild(hit);
  });

  // area de toque invisivel sobre cada marco: com a arte do PDF por baixo, os icones
  // impressos precisam continuar clicaveis mesmo com a nossa camada escondida.
  points.filter(p=>p.kind==='poi').forEach(p=>{
    const lm = D.landmarks.find(l=>l.nome===p.nome) || {};
    const r = lm.iconSize ? lm.iconSize/2 + 6 : 46;
    const hit = el('circle',{class:'lot-hit', cx:p.x, cy:p.y, r});
    hit.addEventListener('click', ()=> onMapPick(p));
    layerHit.appendChild(hit);
  });

  const routeLine = el('polyline',{class:'route-line', points:'', 'stroke-width':11});
  layerRoute.appendChild(routeLine);

  // ============ pan & zoom ============
  const VB0 = {x:100,y:800,w:6100,h:2350};
  const VB = {...VB0};
  // Area realmente desenhada, calculada dos cantos da arte oficial do PDF passados pela
  // mesma matriz que posiciona a imagem. Arrastando, o mapa saia pro vazio e sobrava
  // tela preta; agora a vista para na borda.
  const LIMITES = {x:136, y:698, w:5887, h:2446};
  function prendeNosLimites(){
    // cabe na largura -> nao deixa passar da borda; nao cabe -> centraliza
    if(VB.w <= LIMITES.w) VB.x = Math.min(Math.max(VB.x, LIMITES.x), LIMITES.x + LIMITES.w - VB.w);
    else                  VB.x = LIMITES.x + LIMITES.w/2 - VB.w/2;
    if(VB.h <= LIMITES.h) VB.y = Math.min(Math.max(VB.y, LIMITES.y), LIMITES.y + LIMITES.h - VB.h);
    else                  VB.y = LIMITES.y + LIMITES.h/2 - VB.h/2;
  }
  // unico ponto por onde todo arrasto, zoom e voo passam: prender aqui cobre todos
  function applyVB(){
    prendeNosLimites();
    svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
  }

  // O mapa e muito largo (2,6:1) e a tela do celular e alta (1:2,2). Com um viewBox fixo,
  // "meet" encolhia tudo pra caber na largura e sobrava tela vazia em cima e embaixo.
  // Aqui o viewBox passa a ter a mesma proporcao da tela, entao o mapa sempre preenche.
  function telaProp(){
    const r = svg.getBoundingClientRect();
    return (r.width && r.height) ? r.height / r.width : (VB0.h/VB0.w);
  }
  // mostra o mapa INTEIRO (sobra tela nas laterais ou em cima/embaixo)
  function enquadrarTudo(){
    const p = telaProp();
    const cx = VB0.x + VB0.w/2, cy = VB0.y + VB0.h/2;
    let w = VB0.w, h = w * p;
    if(h < VB0.h){ h = VB0.h; w = h / p; }
    VB.w = w; VB.h = h; VB.x = cx - w/2; VB.y = cy - h/2;
    applyVB();
  }
  // A Chama Crioula (Piquete da Prefeitura) e o ponto de referencia de quem atende no
  // balcao: e onde o site abre e pra onde o botao ⤢ sempre volta, aproximado.
  const FOCO_INICIAL = 'Chama Crioula';
  function focarNaChama(){
    const foco = (D.landmarks||[]).find(l=>l.nome===FOCO_INICIAL);
    if(!foco){ enquadrarTudo(); return; }
    const p = telaProp();
    let w = Math.min(1200, VB0.w), h = w * p;
    if(h > VB0.h){ h = VB0.h; w = h / p; }   // em retrato, a altura do mapa é o limite
    let cx = foco.x, cy = foco.y;
    if(w < VB0.w) cx = Math.min(Math.max(cx, VB0.x + w/2), VB0.x + VB0.w - w/2);
    else cx = VB0.x + VB0.w/2;
    if(h < VB0.h) cy = Math.min(Math.max(cy, VB0.y + h/2), VB0.y + VB0.h - h/2);
    else cy = VB0.y + VB0.h/2;
    VB.w = w; VB.h = h; VB.x = cx - w/2; VB.y = cy - h/2;
    applyVB();
  }

  focarNaChama();
  addEventListener('resize', ()=>{
    // mantem a proporcao do viewBox igual a da tela ao girar o celular
    const r = svg.getBoundingClientRect();
    if(!r.width || !r.height) return;
    const cx = VB.x + VB.w/2, cy = VB.y + VB.h/2;
    VB.h = VB.w * (r.height / r.width);
    VB.x = cx - VB.w/2; VB.y = cy - VB.h/2;
    applyVB();
  });
  // Limites de zoom em funcao da tela: afastar para quando o mapa inteiro couber
  // (antes ia ate 7000 de largura e o mapa sumia no meio do vazio).
  function limitesZoom(){
    // Afasta ate o mapa inteiro caber, e nem um pouco alem. Numa tela alta isso sozinho
    // deixaria o mapa ocupando 19% da altura (o mapa e 2,4:1, o celular em pe e 1:2,2),
    // entao ali o limite e o dobro da altura do mapa: da pra ver bem mais do parque sem
    // a tela virar quase so fundo.
    const p = telaProp();
    return { min: 300, max: Math.min(LIMITES.w, (LIMITES.h / p) * 2) };
  }
  const limitar = w => { const L = limitesZoom(); return Math.max(L.min, Math.min(L.max, w)); };

  let isPanning=false, panStart=null, vbStart=null, pinchStart=null;
  function svgPointFromClient(cx,cy){
    const rect = svg.getBoundingClientRect();
    return { x: VB.x + (cx-rect.left)/rect.width*VB.w, y: VB.y + (cy-rect.top)/rect.height*VB.h };
  }
  svg.addEventListener('pointerdown',(e)=>{ isPanning=true; panStart={x:e.clientX,y:e.clientY}; vbStart={...VB}; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove',(e)=>{
    if(!isPanning) return;
    const rect = svg.getBoundingClientRect();
    const scale = VB.w/rect.width;
    VB.x = vbStart.x - (e.clientX-panStart.x)*scale;
    VB.y = vbStart.y - (e.clientY-panStart.y)*scale;
    applyVB();
  });
  svg.addEventListener('pointerup',()=> isPanning=false);
  svg.addEventListener('pointerleave',()=> isPanning=false);
  function zoom(factor, cx, cy){
    const anchor = cx!=null ? svgPointFromClient(cx,cy) : {x:VB.x+VB.w/2, y:VB.y+VB.h/2};
    const nw = limitar(VB.w*factor);
    const nh = nw * (VB.h/VB.w);
    VB.x = anchor.x - (anchor.x-VB.x)*(nw/VB.w);
    VB.y = anchor.y - (anchor.y-VB.y)*(nh/VB.h);
    VB.w = nw; VB.h = nh;
    applyVB();
  }
  document.getElementById('btnFit').addEventListener('click', focarNaChama);
  document.getElementById('zoomIn').addEventListener('click', ()=> zoom(0.75));
  document.getElementById('zoomOut').addEventListener('click', ()=> zoom(1.3));
  svg.addEventListener('wheel',(e)=>{ e.preventDefault(); zoom(e.deltaY>0?1.1:0.9, e.clientX, e.clientY); }, {passive:false});
  // ---- pinca (dois dedos): zoom + arrasto ----
  // Regra: o ponto do mapa que estava sob o meio dos dedos no inicio do gesto
  // continua sob o meio dos dedos enquanto eles se movem. Todo o calculo usa o
  // viewBox do INICIO do gesto (pinchStart.vb); usar o VB ja alterado fazia o erro
  // se acumular a cada evento e o mapa "fugia".
  function meioDosDedos(toques){
    const [a,b] = toques;
    return { x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2,
             d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) };
  }
  svg.addEventListener('touchstart',(e)=>{
    if(e.touches.length===2){
      const m = meioDosDedos([...e.touches]);
      const r = svg.getBoundingClientRect();
      pinchStart = {
        d: m.d, vb: {...VB}, rect: r,
        // ponto do mapa que esta sob o meio dos dedos agora
        mapX: VB.x + (m.x - r.left)/r.width  * VB.w,
        mapY: VB.y + (m.y - r.top )/r.height * VB.h,
      };
      isPanning = false;            // dois dedos: nao e arrasto de um dedo so
    }
  }, {passive:true});
  svg.addEventListener('touchmove',(e)=>{
    if(e.touches.length!==2 || !pinchStart) return;
    const m = meioDosDedos([...e.touches]);
    const r = pinchStart.rect;
    if(pinchStart.d < 20 || m.d < 20) return;   // dedos quase juntos: razao instavel
    const fator = pinchStart.d / m.d;           // afastou -> viewBox menor -> aproxima
    const w = limitar(pinchStart.vb.w * fator);
    const h = w * (pinchStart.vb.h / pinchStart.vb.w);
    // onde o meio dos dedos esta agora, em fracao da tela
    const fx = (m.x - r.left) / r.width;
    const fy = (m.y - r.top ) / r.height;
    // posiciona o viewBox pra o ponto ancorado cair exatamente ali
    VB.w = w; VB.h = h;
    VB.x = pinchStart.mapX - fx * w;
    VB.y = pinchStart.mapY - fy * h;
    applyVB();
  }, {passive:true});
  function fimDoToque(e){
    if(e.touches.length < 2) pinchStart = null;
    // ao soltar um dedo de dois, o arrasto de um dedo so retomaria com a referencia
    // velha e o mapa daria um pulo: so volta a arrastar num toque novo.
    if(e.touches.length > 0) isPanning = false;
  }
  svg.addEventListener('touchend', fimDoToque);
  svg.addEventListener('touchcancel', fimDoToque);

  function flyTo(x,y,w){
    const prop = VB.h/VB.w;
    VB.w = w || VB.w; VB.h = VB.w*prop;
    VB.x = x - VB.w/2; VB.y = y - VB.h/2;
    applyVB();
  }

  // ============ toast ============

  // ============ navegação estilo Google Maps: busca -> cartão de local -> rota ============

  // ============ waypoints / rota ============
  let stops = [null, null]; // array of point objects or null
  let rotaTracada = false;
  const stopColors = ['var(--waypoint-a)','var(--waypoint-b)'];
  function colorFor(i,total){
    if(i===0) return 'var(--waypoint-a)';
    if(i===total-1) return 'var(--waypoint-b)';

  const stopsList = document.getElementById('stopsList');
  function renderStops(){

  // ---- reordenar paradas arrastando pela alça ----
  // usa eventos de ponteiro (nao o drag-and-drop do HTML, que nao funciona no celular)
  let arrastando = null;
  function ligarArraste(){
    stopsList.querySelectorAll('.stop-grip').forEach(grip=>{
      grip.addEventListener('pointerdown', (ev)=>{
        ev.preventDefault();
        const row = grip.closest('.stop-row');
        arrastando = { de: parseInt(row.dataset.i,10), row };
        row.classList.add('arrastando');
        grip.setPointerCapture(ev.pointerId);
      });
      grip.addEventListener('pointermove', (ev)=>{
        if(!arrastando) return;
        const alvo = indiceEm(ev.clientY);
        stopsList.querySelectorAll('.stop-row').forEach(r=>r.classList.remove('alvo'));
        if(alvo!=null && alvo!==arrastando.de){
          const r = stopsList.querySelector(`.stop-row[data-i="${alvo}"]`);
          if(r) r.classList.add('alvo');
        }
      });
      const soltar = (ev)=>{
        if(!arrastando) return;
        const de = arrastando.de, para = indiceEm(ev.clientY);
        arrastando.row.classList.remove('arrastando');
        stopsList.querySelectorAll('.stop-row').forEach(r=>r.classList.remove('alvo'));
        arrastando = null;
        if(para!=null && para!==de){
          const [item] = stops.splice(de,1);
          stops.splice(para,0,item);
          renderStops(); renderStopMarkers(); updateTraceBtn();
          if(rotaTracada) tracarRota();
          toast('Ordem das paradas atualizada.');
        }
      };
      grip.addEventListener('pointerup', soltar);
      grip.addEventListener('pointercancel', soltar);
    });
  }
  function indiceEm(clientY){
    const linhas = [...stopsList.querySelectorAll('.stop-row')];
    for(const r of linhas){
      const c = r.getBoundingClientRect();
      if(clientY >= c.top && clientY <= c.bottom) return parseInt(r.dataset.i,10);
    }
    if(!linhas.length) return null;
    const prim = linhas[0].getBoundingClientRect();
    if(clientY < prim.top) return 0;
    return linhas.length-1;
  }
  function displayNameSafe(p){ return (displayName(p)||'').replace(/"/g,'&quot;'); }
  document.getElementById('addStop').addEventListener('click', ()=>{
    if(stops.length>=6){ toast('Máximo de 6 paradas.'); return; }
    stops.push(null);   // entra abaixo da última, nao no meio
    renderStops();
    const ult = stopsList.querySelector('.stop-row:last-child input');
    if(ult) ult.focus();
  });
  renderStops();

  function updateTraceBtn(){
    const filled = stops.filter(Boolean);
    document.getElementById('btnTrace').disabled = filled.length < 2;
  }

  // pino estilo Google Maps: bulbo redondo + ponta, apontando exatamente pro local (s.x,s.y = ponta)
  function pinPath(cx,cy,R){
    const by = cy - R*1.7; // centro do bulbo
    return `M ${cx-R} ${by} A ${R} ${R} 0 1 1 ${cx+R} ${by} Q ${cx+R} ${by+R*1.1} ${cx} ${cy} Q ${cx-R} ${by+R*1.1} ${cx-R} ${by} Z`;
  }
  function renderStopMarkers(){
    layerStops.innerHTML='';
    stops.forEach((s,i)=>{
      if(!s) return;
      const color = colorFor(i,stops.length);
      const letter = i===0?'A':(i===stops.length-1?String.fromCharCode(65+stops.length-1):String(i+1));
      const R = 18, by = s.y - R*1.7;
      const g = el('g',{class:'stop-marker'});
      g.appendChild(el('path',{class:'pin', d:pinPath(s.x,s.y,R), fill:color}));
      const t = el('text',{x:s.x, y:by+7, 'font-size':18});
      t.textContent = letter; g.appendChild(t);
      layerStops.appendChild(g);
    });
  }

  function tracarRota(){
    const filled = stops.filter(Boolean);
    if(filled.length<2) return;
    let totalDist=0, fullPath=[], ok=true, segInfo=[];
    for(let i=0;i<filled.length-1;i++){
      const r = dijkstra(filled[i]._nodeId, filled[i+1]._nodeId);
      if(!r){ ok=false; break; }
      totalDist += r.dist;
      segInfo.push({from:filled[i], to:filled[i+1], dist:r.dist, path:r.path});
      const segPts = r.path.map(nodePos);
      fullPath = fullPath.concat(i===0?segPts:segPts.slice(1));
    }
    const info = document.getElementById('routeInfo');
    if(!ok){
      routeLine.classList.remove('show');
      rotaTracada = false;
      expandirRota();
      info.classList.add('show');
      info.innerHTML = 'Não foi possível calcular a rota entre esses pontos.';
      return;
    }
    const ptsStr = fullPath.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    routeLine.setAttribute('points', ptsStr);
    routeLine.classList.add('show');
    rotaTracada = true;
    const meters = Math.round(totalDist * M_POR_UNIDADE);
    const minutes = Math.max(1, Math.round(meters/80)); // ~4.8km/h caminhando
    info.classList.remove('show');   // o detalhe agora vive no cartao da rota
    encolherRota(filled, meters, minutes, segInfo);
    // enquadra a rota.
    // Numa tela alta, uma rota larga obriga a sobrar margem: o viewBox acompanha a
    // proporcao da tela, entao esticar na horizontal estica junto na vertical. Da pra
    // reduzir a sobra com margem menor e prendendo a vista aos limites do mapa.
    const xs = fullPath.map(p=>p[0]), ys = fullPath.map(p=>p[1]);
    const pad = 90;
    const x0=Math.min(...xs)-pad, x1=Math.max(...xs)+pad, y0=Math.min(...ys)-pad, y1=Math.max(...ys)+pad;
    const r0 = svg.getBoundingClientRect(); const prop = r0.height/r0.width || (VB.h/VB.w);
    VB.w = Math.max(x1-x0, 300); VB.h = VB.w*prop;
    if(VB.h < (y1-y0)){ VB.h = y1-y0; VB.w = VB.h/prop; }
    VB.x = (x0+x1)/2 - VB.w/2; VB.y = (y0+y1)/2 - VB.h/2;
    applyVB();   // prendeNosLimites() encosta a vista na area desenhada
  }
  document.getElementById('btnTrace').addEventListener('click', tracarRota);

  // ============ passos escritos da rota ============
  // Os nos de rua carregam o nome da rua no proprio id (Rua_Barbosa_Lessa_1), entao da
  // pra dizer por qual rua a pessoa anda e pra que lado ela vira em cada esquina.
  // Medida com os 8 pontos de referencia do GPS (ver PONTOS_GPS): 10 pares dos 5 pontos
  // bem pareados dao 0.11670 m por unidade por minimos quadrados, e o ajuste de
  // similaridade cai no mesmo valor por outro caminho. Antes estava 0.1124, sem
  // procedencia registrada — as distancias sairam 3.8% curtas esse tempo todo.
  const M_POR_UNIDADE = 0.1167;
  // A que rua um nó pertence. As ruas que o mapa oficial não nomeia estão numeradas
  // pelo próprio id (Sem_Nome_9_1 e Rua_sem_nome_5_2 = ruas sem nome 9 e 5), e a
  // numeração não se repete entre as duas grafias — dá pra chamar cada uma pelo número
  // em vez de deixar o passo mudo.
  function ruaDoNo(id){
    const sn = /^(?:Rua_sem_nome|Sem_Nome)_(\d+)_\d+$/i.exec(id);
    if(sn) return { chave:'sn'+sn[1], nome:'Rua sem nome '+sn[1] };
    const bruto = String(id).replace(/_\d+(_\d+)?$/,'');
    // praça/pórtico/estacionamento são lugares, não vias; PT_/VIA_/GPS são nós de
    // entrada que criamos — em nenhum deles dá pra dizer "vire na rua tal"
    if(/^(rotula|Pra[cç]a|P[oó]rtico|Casa_do|Estacionamento|PT|GPS|VIA)/i.test(bruto)) return null;
    const nome = bruto.replace(/_/g,' ');
    const chave = semAcento(nome);
    // grafia do rotulo do mapa oficial ganha: o id do no vem sem acento em tres ruas
    // (Otavio, Jose Claudio, Aparicio) e a rota misturava as duas formas
    return { chave, nome: grafiaOficial[chave] || nome };
  }
  // O nome do passo vem da ARESTA, não do nó. A Rua Oliveira Silveira, por exemplo,
  // está no grafo como uma aresta longa entre um nó da Paixão Cortes e um da Barbosa
  // Lessa: pelo nó, o trecho dela saía com o nome da rua errada.
  // Ordem: (1) as duas pontas concordam — os nós foram nomeados à mão, mandam eles;
  // (2) um rótulo de rua paralelo e em cima da aresta; (3) o nó de chegada.
  const grafiaOficial = {};
  D.streetLabels.forEach(s=>{ grafiaOficial[semAcento(s.text)] = s.text; });
  const rotulosSeg = D.streetLabels.map(s=>{
    const a = s.rot * Math.PI/180;
    return { txt:s.text, a:[s.x, s.y], b:[s.x + Math.cos(a)*s.len, s.y + Math.sin(a)*s.len] };
  });
  function anguloEntre(p1,p2,q1,q2){
    const g = Math.abs(Math.atan2(p2[1]-p1[1], p2[0]-p1[0]) - Math.atan2(q2[1]-q1[1], q2[0]-q1[0]))
              * 180/Math.PI % 180;
    return g > 90 ? 180-g : g;
  }
  // vizinhos de cada nó de rua, pra saber por onde uma rua continua
  const vizinhos = {};
  D.roadEdges.forEach(([a,b])=>{
    (vizinhos[a] = vizinhos[a] || []).push(b);
    (vizinhos[b] = vizinhos[b] || []).push(a);
  });
  // desvio entre seguir de a pra b e depois de b pra c (0 = reto)
  function desvio(a,b,c){
    const g = Math.abs(Math.atan2(b[1]-a[1], b[0]-a[0]) - Math.atan2(c[1]-b[1], c[0]-b[0])) * 180/Math.PI;
    return Math.min(g, 360-g);
  }
  const cacheAresta = {};
  function nomeDaAresta(x,y){
    // nó de entrada: quem tem nome é a rua em que ele foi criado
    const via = viaAresta[x] || viaAresta[y];
    const ia = via ? via[0] : x, ib = via ? via[1] : y;
    const chave = ia + '\u0000' + ib;
    if(chave in cacheAresta) return cacheAresta[chave];
    cacheAresta[chave] = calculaNomeDaAresta(ia, ib);
    return cacheAresta[chave];
  }
  function calculaNomeDaAresta(ia, ib){
    const a = D.roadNodes[ia], b = D.roadNodes[ib];
    if(!a || !b) return '';
    const rA = ruaDoNo(ia), rB = ruaDoNo(ib);
    // 1) as duas pontas são da mesma rua — os nós foram nomeados à mão, mandam eles
    if(rA && rB && rA.chave === rB.chave) return rA.nome;
    // 2) um rótulo de rua paralelo e em cima da aresta
    const meio = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    let rot = null;
    rotulosSeg.forEach(r=>{
      if(anguloEntre(a,b,r.a,r.b) > 20) return;
      const { pt } = projeta(meio, r.a, r.b);
      const d = dist(meio, pt);
      if(d > 60) return;
      if(!rot || d < rot.d) rot = { d, txt:r.txt };
    });
    if(rot) return rot.txt;
    // 3) a aresta CONTINUA a rua de uma das pontas? Os cruzamentos foram nomeados pela
    //    rua transversal (Rua_Gildo_de_Freitas_2 fica em cima da rua sem nome 9), então
    //    a prova é seguir reto: se depois de ib a rua de ia recomeça quase na mesma
    //    direção, a aresta é dela. Sem isso o passo dizia "siga pela Gildo de Freitas"
    //    para quem só estava cruzando a Gildo de Freitas.
    function continua(rua, de, para){
      if(!rua) return false;
      const P = D.roadNodes[de], Q = D.roadNodes[para];
      return (vizinhos[para] || []).some(c=>{
        if(c === de) return false;
        const r = ruaDoNo(c);
        return r && r.chave === rua.chave && D.roadNodes[c] && desvio(P, Q, D.roadNodes[c]) < 35;
      });
    }
    const segueA = continua(rA, ia, ib);
    const segueB = continua(rB, ib, ia);
    if(segueA && !segueB) return rA.nome;
    if(segueB && !segueA) return rB.nome;
    return '';   // nenhuma prova: melhor "vire à direita e siga 20 m" do que a rua errada
  }

  function giro(a,b){
    // no SVG o y cresce pra baixo, entao produto vetorial positivo = curva pra direita
    const ang = Math.atan2(a[0]*b[1]-a[1]*b[0], a[0]*b[0]+a[1]*b[1]) * 180/Math.PI;
    if(Math.abs(ang) < 30)  return { ico:'↑', txt:'Siga em frente', prep:'pela' };
    if(Math.abs(ang) > 150) return { ico:'↰', txt:'Faça o retorno', prep:'na' };
    return ang > 0 ? { ico:'↱', txt:'Vire à direita', prep:'na' }
                   : { ico:'↰', txt:'Vire à esquerda', prep:'na' };
  }
  function passosDoTrecho(path, destino){
    const pts = path.map(nodePos);
    const pernas = [];
    for(let i=0;i<path.length-1;i++){
      const nome = nomeDaAresta(path[i], path[i+1]);
      const d = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
      const ult = pernas[pernas.length-1];
      if(ult && ult.nome===nome){ ult.d += d; ult.fim = pts[i+1]; }
      else pernas.push({ nome, d, ini:pts[i], fim:pts[i+1] });
    }
    // Toco sem nome que segue reto na perna vizinha é parte dela: o pedaço entre a Rua
    // Dimas Costa e a rua sem nome 9, por exemplo, é o começo da rua sem nome 9.
    const dirDe = p => [p.fim[0]-p.ini[0], p.fim[1]-p.ini[1]];
    const anguloVet = (u,v)=>{
      const g = Math.abs(Math.atan2(u[1],u[0]) - Math.atan2(v[1],v[0])) * 180/Math.PI;
      return Math.min(g, 360-g);
    };
    pernas.forEach((perna,i)=>{
      if(perna.nome) return;
      const prox = pernas[i+1], ant = pernas[i-1];
      // 40 graus e a mesma folga do 'siga em frente': se nao vira, nao e outra rua
      if(prox && prox.nome && anguloVet(dirDe(perna), dirDe(prox)) < 40){ perna.nome = prox.nome; return; }
      if(ant  && ant.nome  && anguloVet(dirDe(ant), dirDe(perna)) < 40){ perna.nome = ant.nome; }
    });
    for(let i=pernas.length-1;i>0;i--){          // junta de novo o que ficou com o mesmo nome
      if(pernas[i].nome && pernas[i].nome === pernas[i-1].nome){
        pernas[i-1].d += pernas[i].d; pernas[i-1].fim = pernas[i].fim; pernas.splice(i,1);
      }
    }
    // desvio de poucos metros so polui a lista: entra na perna anterior
    for(let i=pernas.length-1;i>0;i--){
      if(pernas[i].d * M_POR_UNIDADE < 12){
        pernas[i-1].d += pernas[i].d; pernas[i-1].fim = pernas[i].fim; pernas.splice(i,1);
      }
    }
    const passos = pernas.map((perna,i)=>{
      const m = Math.round(perna.d * M_POR_UNIDADE);
      if(i===0) return { ico:'↑', txt: perna.nome ? `Siga pela ${perna.nome}` : 'Siga pelo caminho à frente', m };
      const ant = pernas[i-1];
      const g = giro([ant.fim[0]-ant.ini[0], ant.fim[1]-ant.ini[1]],
                     [perna.fim[0]-perna.ini[0], perna.fim[1]-perna.ini[1]]);
      return { ico:g.ico, txt: perna.nome ? `${g.txt} ${g.prep} ${perna.nome}` : g.txt, m };
    });
    passos.push({ ico:'📍', txt:`Chegou em ${displayName(destino)}`, m:null });
    return passos;
  }
  function renderPassos(segInfo){
    const ol = document.getElementById('rotaPassos');
    ol.innerHTML = '';
    segInfo.forEach(seg=> passosDoTrecho(seg.path, seg.to).forEach(pa=>{
      const li = document.createElement('li');
      li.innerHTML = `<span class="ico">${pa.ico}</span><span>${pa.txt}` +
        (pa.m!=null ? ` <span class="dist">· ${pa.m} m</span>` : '') + `</span>`;
      ol.appendChild(li);
    }));
  }

  // ---- cartao da rota (no celular sobe de baixo e abre puxando pela alca) ----
  const rotaCard = document.getElementById('rotaCard');
  function encolherRota(paradas, metros, minutos, segInfo){
    document.getElementById('resumoDist').textContent = `${metros} m · ~${minutos} min a pé`;
    document.getElementById('resumoTrajeto').textContent =
      paradas.map(displayName).join('  →  ');

  // ============ GPS ============
  // Pontos de referencia levantados no Google Maps pelo Caina, com o marco correspondente
  // no nosso mapa. Ficam registrados aqui pra dar pra auditar e refazer o ajuste — os 10
  // pontos da primeira versao se perderam, sobraram so os coeficientes.
  //
  //   nome                     latitude             longitude            marco no mapa
  //   Palco Jayme C. Braun     -30.04101888697755   -51.23775400743938   Palco Jayme Caetano Braun
  //   Acesso Estac. Leste      -30.041211171276363  -51.23385493545118   Estacionamento Leste (acesso)
  //   Portico das Cuias        -30.042210748721452  -51.2347890146585    Portico_das_Cuias
  //   Rotula das Cuias         -30.04240865323654   -51.23335147959289   rotula_das_cuias
  //   Playground Sepe Tiaraju  -30.04040899348694   -51.23866165083      Playground Sepe Tiaraju
  //
  // Outros tres pontos foram levantados e DESCARTADOS do ajuste porque o pino do Google e
  // o nosso marco nao sao o mesmo lugar fisico (10 a 16 m de discrepancia, contra 4 m dos
  // de cima): Portico da Orla (-30.041803105102137, -51.23805991662277), Casa do Gaucho
  // (-30.0406154463047, -51.23662652338389) e Estancia da Harmonia (-30.04100529173799,
  // -51.23718284032006). No nosso mapa a Casa do Gaucho, por exemplo, e o centro de um
  // retangulo de 420x380 — o predio inteiro — e o pino do Google fica num canto dele.
  //
  // Ajuste de SIMILARIDADE (rotacao + escala unica), nao afim: o mapa e uma planta fiel,
  // entao a escala tem que ser igual nos dois eixos. O ajuste antigo era afim e saiu com
  // 10% de diferenca entre os eixos, o que fazia o erro crescer com a distancia.
  // Giro -6.08 graus, escala 0.1167 m/unidade, residuo 2.5 m (pior 4.1 m).
  //
  // Validacao cruzada (tira um ponto, ajusta com 4, tenta prever o que ficou de fora):
  // 3.9 m de RMS, pior caso 5.6 m. A incerteza dos parametros e de 0.24% na escala e
  // 0.11 grau no giro, entao extrapolar ate os cantos do mapa (os pontos de controle
  // cobrem so o miolo) acrescenta 1.3 m. Nao adianta levantar mais pontos: o chip de
  // GPS do celular erra de 5 a 15 m, o que domina tudo isso.
  const GPS_FIT = {
    x: [821704.177, -100546.263, 39083567.379],
    y: [-87478.886, -944448.290, -32852461.706],
  };
  function gpsToLocal(lat,lng){
    const x = GPS_FIT.x[0]*lng + GPS_FIT.x[1]*lat + GPS_FIT.x[2];
    const y = GPS_FIT.y[0]*lng + GPS_FIT.y[1]*lat + GPS_FIT.y[2];
    return { x, y };
  }
  // Diagnostico do GPS: fica visivel nas configuracoes pra dar pra saber exatamente
  // o que aconteceu quando ele nao encontra a posicao.
  let gpsDiag = 'ainda não testado';
  function setDiag(txt){
    gpsDiag = txt;
    const el2 = document.getElementById('gpsDiag');
    if(el2) el2.textContent = txt;
  }
  function startGps(onFirstFix){
    if(!navigator.geolocation){
      setDiag('este navegador não tem geolocalização');
      toast('Geolocalização não disponível neste navegador.'); return;
    }
    // o navegador bloqueia geolocalizacao fora de HTTPS (file:// e http:// comum)
    if(!window.isSecureContext){
      setDiag('bloqueado: a página não está em HTTPS (' + location.protocol + ')');
      toast('O navegador só libera GPS em HTTPS. Abra o site pelo endereço https, não pelo arquivo.');
      return;
    }
    if(gpsWatchId!=null) return;
    setDiag('procurando sinal…');
    gpsWatchId = navigator.geolocation.watchPosition((pos)=>{
      const {latitude:lat, longitude:lng, accuracy:acc} = pos.coords;
      const {x,y} = gpsToLocal(lat,lng);
      const dentro = Number.isFinite(x) && Number.isFinite(y) &&
        x >= VB0.x-800 && x <= VB0.x+VB0.w+800 && y >= VB0.y-800 && y <= VB0.y+VB0.h+800;
      setDiag(`${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(acc)} m) → mapa ${Math.round(x)}, ${Math.round(y)}` +
              (dentro ? ' — dentro do parque' : ' — FORA dos limites do mapa'));
      if(!dentro){
        gpsPoint = null; drawGpsDot();
        toast('Sua posição caiu fora dos limites do mapa. Veja o diagnóstico em ⚙️ Configurações.');
        return;
      }
      gpsPoint = { kind:'gps', nome:'Minha localização', x, y, num:'' };
      drawGpsDot();
      if(onFirstFix){ onFirstFix(); onFirstFix=null; }
    }, (err)=>{
      const motivos = {1:'permissão negada', 2:'posição indisponível (sem sinal)', 3:'tempo esgotado'};
      setDiag('erro: ' + (motivos[err.code] || err.message));
      toast('Não foi possível obter sua localização: ' + (motivos[err.code] || err.message) + '.');
    }, { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
  }

  // ============ busca / autocomplete ============
  function positionSuggestions(input, sugEl){
    const r = input.getBoundingClientRect();
    sugEl.style.left = r.left+'px';
    sugEl.style.top = (r.bottom+4)+'px';
    sugEl.style.width = r.width+'px';

  function setupAutocomplete(input, sugEl, onPick){
    let active=-1, items=[];
    input.addEventListener('input', ()=>{
      const q = input.value.trim();
      if(!q){ sugEl.classList.remove('open'); return; }
      positionSuggestions(input, sugEl);
      items = points.filter(p=>matches(p,q) && !p.noExactPos).slice(0,40);
      const catItems = points.filter(p=>p.noExactPos && matches(p,q)).slice(0,10);
      items = items.concat(catItems);
      sugEl.innerHTML='';
      items.forEach(p=>{
        const d = document.createElement('div'); d.className='item';
        d.innerHTML = `<span class="n">${p.num||''}</span><span class="nm">${p.tipo?p.tipo+' ':''}${p.nome}</span><span class="tag">${p.catGroup||p.kind}</span>`;
        d.addEventListener('mousedown',(e)=>{ e.preventDefault(); pick(p); });
        sugEl.appendChild(d);
      });
      active=-1; sugEl.classList.toggle('open', items.length>0);
    });
    input.addEventListener('keydown',(e)=>{
      if(!sugEl.classList.contains('open')) return;
      if(e.key==='ArrowDown'){ active=Math.min(active+1,items.length-1); paint(); e.preventDefault(); }
      else if(e.key==='ArrowUp'){ active=Math.max(active-1,0); paint(); e.preventDefault(); }
      else if(e.key==='Enter'){ if(active>=0){ pick(items[active]); e.preventDefault(); } }
      else if(e.key==='Escape'){ sugEl.classList.remove('open'); }
    });
    input.addEventListener('blur', ()=> setTimeout(()=>sugEl.classList.remove('open'),120));
    function paint(){ [...sugEl.children].forEach((c,i)=> c.classList.toggle('active', i===active)); }
    function pick(p){ input.value = displayName(p); sugEl.classList.remove('open'); onPick(p); }
  }

  // ============ busca tolerante a erro de digitação ============
  // Num balcão a pessoa fala o nome e quem atende digita como ouviu: "kerencia" não
  // achava nada e "tiaraju" levava ao Playground em vez do piquete 161 "Tiarayú".
  // Só roda quando a busca normal volta vazia.
  function distEdicao(a, b, limite){
    if(Math.abs(a.length - b.length) > limite) return limite+1;
    let ant = Array.from({length:b.length+1}, (_,i)=>i);
    for(let i=1;i<=a.length;i++){
      const atual = [i];
      let melhorDaLinha = i;
      for(let j=1;j<=b.length;j++){
        const custo = a[i-1] === b[j-1] ? 0 : 1;
        atual[j] = Math.min(ant[j]+1, atual[j-1]+1, ant[j-1]+custo);
        if(atual[j] < melhorDaLinha) melhorDaLinha = atual[j];
      }
      if(melhorDaLinha > limite) return limite+1;   // a linha inteira já estourou
      ant = atual;
    }
    return ant[b.length];
  }
  // Reduz a palavra ao som, em portugues: "querencia" e "kerencia" viram a mesma coisa,
  // mas "banheiro" e "pinheiro" continuam diferentes. Sem isso nao dava pra afrouxar a
  // tolerancia o bastante pra "kerencia" sem trazer "pinheiro" junto.
  function fonetica(w){
    return w
      .replace(/ph/g,'f').replace(/ch/g,'x')
      .replace(/lh/g,'L').replace(/nh/g,'N')   // guarda antes de derrubar o h
      .replace(/h/g,'')
      .replace(/qu/g,'k').replace(/q/g,'k')
      .replace(/c([eiy])/g,'s$1').replace(/c/g,'k')
      .replace(/z/g,'s').replace(/y/g,'i').replace(/w/g,'v')
      .replace(/(.)+/g,'$1')                 // letra dobrada soa igual a simples
      .replace(/L/g,'lh').replace(/N/g,'nh');
  }
  function palavrasDe(p){
    return [displayName(p), p.alias||'', p.resp||'', (p.tambemChamado||[]).join(' ')]
      .join(' ').split(/[^0-9A-Za-zÀ-ÿ]+/).map(w=>fonetica(semAcento(w))).filter(w=>w.length > 2);
  }
  // Tolerancia proporcional ao tamanho da palavra: 1 erro ate 9 letras, 2 ate 14.
  // Com folga fixa de 2, "banheiro" casava com "Pinheiro" (b->p, a->i).
  function limiteDe(palavra){ return Math.max(1, Math.floor(palavra.length * 0.2)); }
  function parecidos(q){
    const termos = q.split(/[^0-9A-Za-zÀ-ÿ]+/).map(t=>fonetica(semAcento(t))).filter(t=>t.length >= 3);
    if(!termos.length) return [];
    // numero de lote nao tem "parecido": 161 sugeria 101, 111, 121...
    if(termos.every(t=>/^[0-9]+$/.test(t))) return [];
    const achados = [];
    points.forEach(p=>{
      if(!p._palavras) p._palavras = palavrasDe(p);
      let soma = 0;
      const todosBatem = termos.every(t=>{
        const lim = limiteDe(t);
        let melhor = lim + 1;
        p._palavras.forEach(w=>{ const d = distEdicao(t, w, lim); if(d < melhor) melhor = d; });
        if(melhor > lim) return false;
        soma += melhor;
        return true;
      });
      // soma 0 acontece quando o som bate exatamente ("kerencia" = "querencia"):
      // e o melhor caso, nao um descarte. Repetido com a lista exata ja e filtrado fora.
      if(todosBatem) achados.push({ p, d:soma });
    });
    return achados.sort((a,b)=> a.d - b.d).slice(0,20).map(x=>x.p);
  }

  let selectedPlace = null;

  function onMapPick(p){
    // com partida fixa ligada, escolher um lugar ja vira rota: so o destino e escolhido.
    // Compara o OBJETO, nao o nome: o lote 139 tambem se chama "Chama Crioula" e, por

    if(!p.noExactPos) flyTo(p.x, p.y, 700);
    selectedPlace = p;
    document.getElementById('placeTitle').textContent = displayName(p);
    document.getElementById('placeCat').textContent = catNiceLabel[p.cat] || p.catGroup || (p.kind==='lote' ? 'Piquete' : '');
    const elResp = document.getElementById('placeResp');
    elResp.style.display = p.resp ? 'block' : 'none';
